<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Login — General Science</title>
  <link rel="stylesheet" href="assets/css/main.css?v=10" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #062b5f 0%, #0d47a1 50%, #1976d2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    .login-header { text-align: center; margin-bottom: 24px; }
    .login-header .lock-icon { font-size: 2.5rem; display: block; margin-bottom: 8px; }
    .login-header h1 { font-size: 1.35rem; margin: 0 0 4px; color: #0d47a1; font-weight: 700; }
    .login-header p { margin: 0; font-size: 0.85rem; color: #5f6368; }
    .login-group { margin-bottom: 18px; }
    .login-group label { display: block; font-size: 0.8rem; font-weight: 700; color: #37474f; margin-bottom: 6px; letter-spacing: 0.3px; text-transform: uppercase; }
    .login-group input { width: 100%; padding: 14px 16px; font-family: inherit; font-size: 1rem; border: 1.5px solid #cfd8dc; border-radius: 10px; background: #fff; color: #1a1a1a; transition: all 0.15s ease; box-sizing: border-box; }
    .login-group input:focus { outline: none; border-color: #0d47a1; box-shadow: 0 0 0 4px rgba(13, 71, 161, 0.1); }
    .login-btn { width: 100%; padding: 14px 20px; background: linear-gradient(135deg, #0d47a1, #1565c0); color: #fff; border: none; border-radius: 10px; font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 12px rgba(13, 71, 161, 0.25); }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(13, 71, 161, 0.35); }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .login-error { background: #ffebee; border-left: 4px solid #c62828; color: #b71c1c; padding: 12px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }
    .login-success { background: #e8f5e9; border-left: 4px solid #2e7d32; color: #1b5e20; padding: 12px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 16px; }
    .back-link { display: block; text-align: center; margin-top: 16px; font-size: 0.85rem; color: #0d47a1; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-header">
      <span class="lock-icon">🔒</span>
      <h1>Teacher Access</h1>
      <p>Enter your password to continue</p>
    </div>

    <div id="message-slot"></div>

    <form id="login-form" autocomplete="off">
      <div class="login-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter teacher password"
               autocomplete="current-password" required autofocus />
      </div>
      <button type="submit" id="login-btn" class="login-btn">Unlock →</button>
    </form>

    <a href="index.html" class="back-link">← Back to Home</a>
  </div>

  <script>
    /* ============================================================
       Self-contained teacher login — no external dependencies
       Password is verified via SHA-256 hash comparison.
       ============================================================ */
    (function() {
      'use strict';

      var PASSWORD_HASH = '01d58c1ac3df6d023d869e50bf78e2f9185332c281f665fd53f6dbd7592df45e';
      var SESSION_KEY = 'gsa_teacher_session';

      var form = document.getElementById('login-form');
      var passwordEl = document.getElementById('password');
      var btn = document.getElementById('login-btn');
      var messageSlot = document.getElementById('message-slot');

      /* If already logged in, go to dashboard */
      if (sessionStorage.getItem(SESSION_KEY)) {
        window.location.replace('instructor.html');
        return;
      }

      /* SHA-256 hash of a string, returns hex */
      async function sha256(text) {
        var enc = new TextEncoder();
        var data = enc.encode(text);
        var buf = await crypto.subtle.digest('SHA-256', data);
        var bytes = new Uint8Array(buf);
        var hex = '';
        for (var i = 0; i < bytes.length; i++) {
          hex += bytes[i].toString(16).padStart(2, '0');
        }
        return hex;
      }

      function showError(msg) {
        messageSlot.innerHTML = '<div class="login-error">❌ ' + msg + '</div>';
      }

      function showSuccess(msg) {
        messageSlot.innerHTML = '<div class="login-success">✅ ' + msg + '</div>';
      }

      form.addEventListener('submit', async function(e) {
        e.preventDefault();
        messageSlot.innerHTML = '';

        var password = passwordEl.value;
        if (!password) return;

        btn.disabled = true;
        btn.textContent = 'Checking…';

        try {
          var inputHash = await sha256(password);

          if (inputHash === PASSWORD_HASH) {
            /* Success — store session and redirect */
            var session = {
              authenticatedAt: Date.now(),
              token: Math.random().toString(36).slice(2)
            };
            sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
            showSuccess('Authenticated! Redirecting…');
            setTimeout(function() {
              window.location.replace('instructor.html');
            }, 500);
            return;
          }

          /* Wrong password */
          showError('Incorrect password. Please try again.');
          passwordEl.value = '';
          passwordEl.focus();
        } catch (err) {
          showError('Error: ' + err.message);
        }

        btn.disabled = false;
        btn.textContent = 'Unlock →';
      });
    })();
  </script>
</body>
</html>

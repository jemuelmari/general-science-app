<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessment Tracker — Teacher · General Science</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=1.0.10" />
  <link rel="stylesheet" href="../assets/css/teacher.css?v=1.0.10" />
  <style>
    .ast-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 24px; align-items: end; }
    .ast-filters button { width: 100%; padding: 10px 12px; background: #0d47a1; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    
    .matrix-wrapper { overflow-x: auto; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 4px; }
    .matrix-table { width: 100%; border-collapse: separate; border-spacing: 0; min-width: 900px; font-size: 0.8rem; }
    .matrix-table thead th { background: #f5f7fa; color: #37474f; padding: 10px 8px; text-align: center; font-weight: 700; font-size: 0.72rem; text-transform: uppercase; border: 1px solid #e0e0e0; border-bottom: 2px solid #b0bec5; white-space: nowrap; position: sticky; top: 0; z-index: 5; }
    .matrix-table thead th:first-child { text-align: left; padding-left: 14px; min-width: 220px; z-index: 10; position: sticky; left: 0; background: #f5f7fa; }
    .matrix-table tbody td { padding: 10px 8px; text-align: center; border: 1px solid #e0e0e0; color: #37474f; font-size: 0.78rem; }
    .matrix-table tbody td:first-child { text-align: left; padding-left: 14px; font-weight: 600; background: #fff; position: sticky; left: 0; z-index: 3; border-right: 2px solid #b0bec5; }
    
    .matrix-cell { display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 32px; border-radius: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .matrix-cell.not-taken { background: #f5f5f5; color: #bdbdbd; }
    .matrix-cell.passed { background: #e8f5e9; color: #1b5e20; }
    .matrix-cell.on-track { background: #e3f2fd; color: #0d47a1; }
    .matrix-cell.remediation { background: #fff3e0; color: #e65100; }
    .matrix-cell.failed { background: #ffebee; color: #b71c1c; }
    .matrix-cell.locked { background: #212121; color: #fff; font-size: 1rem; }
    .section-group-header { background: #0d47a1 !important; color: #fff !important; font-weight: 800 !important; padding: 10px 14px !important; text-align: left !important; }
    
    @media (max-width: 600px) {
      .ast-filters { grid-template-columns: 1fr; }
      .ast-filters select, .ast-filters button { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div><h1>📈 Assessment Tracker</h1><span class="version">v1.0.10</span></div>
      <nav class="teacher-nav">
        <a href="../instructor.html">🏠 Dashboard</a>
        <a href="../classrecord.html">📊 Class Record</a>
        <button id="btn-logout">🚪 Logout</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">
    <div class="teacher-hero" style="padding:24px;">
      <div class="teacher-hero-content" style="align-items:flex-start;">
        <div class="teacher-hero-text">
          <h1 style="font-size:1.4rem;">Assessment Submission Matrix</h1>
          <p>See at a glance who has taken quizzes, STs, PTs, and the Term Exam for each term.</p>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="ast-filters">
        <div class="form-group">
          <label class="form-label">Term</label>
          <select id="filter-term" class="form-control">
            <option value="term1">Term 1</option>
            <option value="term2">Term 2</option>
            <option value="term3">Term 3</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Section</label>
          <select id="filter-section" class="form-control">
            <option value="">All Sections</option>
            <option value="ACADEMIC A">ACADEMIC A</option>
            <option value="ACADEMIC B">ACADEMIC B</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">&nbsp;</label>
          <button id="btn-refresh">🔄 Refresh</button>
        </div>
      </div>
    </div>

    <div id="results-area">
      <div class="card" style="text-align:center;padding:40px;color:#90a4ae;">⏳ Loading from cloud...</div>
    </div>
  </main>

  <footer class="app-footer"><p>General Science Online Modular Application · <span class="version">v1.0.10</span></p></footer>

  <script src="../config.js?v=1.0.10"></script>
  <script src="../assets/js/app.js?v=1.0.10"></script>
  <script src="../assets/js/store.js?v=1.0.10"></script>
  <script src="../assets/js/security.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-auth.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-auth-boot.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-cloud.js?v=1.0.10"></script>
  
  <script>
    (function() {
      'use strict';

      const ASSESSMENTS = [
        { key: 'quiz1', type: 'quizzes', id: 'quiz1', label: 'Q1' },
        { key: 'quiz2', type: 'quizzes', id: 'quiz2', label: 'Q2' },
        { key: 'quiz3', type: 'quizzes', id: 'quiz3', label: 'Q3' },
        { key: 'st1', type: 'st', id: 'st1', label: 'ST1' },
        { key: 'st2', type: 'st', id: 'st2', label: 'ST2' },
        { key: 'pt1', type: 'pt', id: 'pt1', label: 'PT1' },
        { key: 'pt2', type: 'pt', id: 'pt2', label: 'PT2' },
        { key: 'pt3', type: 'pt', id: 'pt3', label: 'PT3' },
        { key: 'te', type: 'te', id: 'te', label: 'TE' }
      ];

      let allStudents = [];

      TeacherAuthBoot.ready(async function(auth) {
        if (!auth.isAuthenticated()) { window.location.replace('../teacher-login.html'); return; }
        document.getElementById('btn-logout').addEventListener('click', function() { auth.logout(); });
        document.getElementById('btn-refresh').addEventListener('click', render);

        try {
          allStudents = await TeacherCloud.fetchStudents();
          render();
        } catch (err) {
          document.getElementById('results-area').innerHTML = `<div class="card" style="text-align:center;padding:40px;color:#c62828;">❌ ${err.message}</div>`;
        }
      });

      function render() {
        const term = document.getElementById('filter-term').value;
        const sectionFilter = document.getElementById('filter-section').value;
        const area = document.getElementById('results-area');

        let students = allStudents;
        if (sectionFilter) students = students.filter(s => s.section === sectionFilter);
        
        if (!students.length) { area.innerHTML = '<div class="card" style="text-align:center;padding:40px;">👥 No students found.</div>'; return; }
        students.sort((a, b) => (a.lastName || '').localeCompare(b.lastName || ''));

        let bySection = {};
        students.forEach(s => {
          const sec = s.section || 'Unknown';
          if (!bySection[sec]) bySection[sec] = [];
          bySection[sec].push(s);
        });

        let totalSubs = 0;
        let rowsHtml = '';

        Object.keys(bySection).forEach(section => {
          let secStudents = bySection[section];
          rowsHtml += `<tr><td colspan="${ASSESSMENTS.length + 1}" class="section-group-header">${section} (${secStudents.length})</td></tr>`;
          
          secStudents.forEach(s => {
            const initials = ((s.firstName || '?').charAt(0) + (s.lastName || '?').charAt(0)).toUpperCase();
            rowsHtml += `<tr><td>
              <div style="display:flex;align-items:center;gap:10px;">
                <div class="student-avatar" style="width:32px;height:32px;font-size:0.7rem;background:#0d47a1;">${initials}</div>
                <div>
                  <div style="font-weight:600;color:#1a1a1a;font-size:0.85rem;">${s.lastName}, ${s.firstName}</div>
                  <div style="font-size:0.7rem;color:#90a4ae;">LRN: ${s.lrn}</div>
                </div>
              </div>
            </td>`;

            ASSESSMENTS.forEach(a => {
              const scores = s.progress?.scores?.[term] || {};
              let record = null;
              if (a.type === 'te') record = scores.te;
              else record = scores[a.type]?.[a.id];

              let display = '—', title = `${a.label}: Not yet taken`, cls = 'not-taken';
              
              if (record) {
                totalSubs++;
                const pct = record.percent || (record.total ? Math.round((record.score / record.total) * 100) : null);
                if (a.type === 'pt') {
                  display = record.score != null ? String(record.score) : '✓';
                  title = `PT: ${display}/100`;
                  cls = record.score >= 75 ? 'passed' : record.score >= 65 ? 'remediation' : 'failed';
                } else {
                  display = `${record.score}/${record.total}`;
                  title = `${a.label}: ${display}`;
                  if (pct >= 90) cls = 'passed';
                  else if (pct >= 75) cls = 'on-track';
                  else if (pct >= 65) cls = 'remediation';
                  else cls = 'failed';
                }
              }
              rowsHtml += `<td><span class="matrix-cell ${cls}" title="${title}">${display}</span></td>`;
            });
            rowsHtml += `</tr>`;
          });
        });

        const totalPossible = students.length * ASSESSMENTS.length;
        const completionPct = totalPossible ? Math.round((totalSubs / totalPossible) * 100) : 0;

        area.innerHTML = `
          <div class="stats-grid" style="margin-bottom:20px;">
            <div class="stat-card blue"><div class="stat-icon">👥</div><div class="stat-value">${students.length}</div><div class="stat-label">Students</div></div>
            <div class="stat-card green"><div class="stat-icon">📝</div><div class="stat-value">${totalSubs}</div><div class="stat-label">Submissions</div></div>
            <div class="stat-card ${completionPct >= 75 ? 'green' : completionPct >= 50 ? 'amber' : 'red'}"><div class="stat-icon">📊</div><div class="stat-value">${completionPct}%</div><div class="stat-label">Completion</div></div>
          </div>
          <div class="matrix-wrapper">
            <table class="matrix-table">
              <thead>
                <tr><th>Student</th>${ASSESSMENTS.map(a => `<th>${a.label}</th>`).join('')}</tr>
              </thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        `;
      }
    })();
  </script>
</body>
</html>

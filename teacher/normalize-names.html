<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Normalize Names — Teacher · General Science</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=1.0.10" />
  <link rel="stylesheet" href="../assets/css/teacher.css?v=1.0.10" />
  <style>
    .nn-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 24px; align-items: end; }
    .nn-filters button { width: 100%; padding: 10px 12px; background: #0d47a1; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    
    .nn-row { background: #fff; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; border-left: 4px solid #1976d2; display: grid; grid-template-columns: 40px 1fr 1fr 1fr 1fr 100px; gap: 12px; align-items: center; }
    .nn-input { width: 100%; padding: 8px 10px; border: 1.5px solid #cfd8dc; border-radius: 6px; font-size: 0.85rem; }
    .nn-input:focus { border-color: #0d47a1; outline: none; }
    
    @media (max-width: 900px) {
      .nn-filters { grid-template-columns: 1fr; }
      .nn-filters select, .nn-filters button { font-size: 16px; }
      .nn-row { grid-template-columns: 1fr; gap: 8px; }
      .nn-cell-label { display: block; font-size: 0.7rem; color: #78909c; margin-bottom: 2px; }
    }
  </style>
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div><h1>📝 Normalize Names</h1><span class="version">v1.0.10</span></div>
      <nav class="teacher-nav">
        <a href="../instructor.html">🏠 Dashboard</a>
        <a href="../classrecord.html">📊 Class Record</a>
        <button id="btn-logout">🚪 Logout</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">
    <div class="teacher-hero" style="padding:24px;">
      <div class="teacher-hero-content" style="align-items:flex-start;">
        <div class="teacher-hero-text">
          <h1 style="font-size:1.4rem;">Normalize Student Names</h1>
          <p>Fix inconsistencies — <strong>Last Name in ALL CAPS</strong> · First &amp; Middle in <strong>Title Case</strong>.</p>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="nn-filters">
        <div class="form-group">
          <label class="form-label">Section</label>
          <select id="filter-section" class="form-control">
            <option value="">All Sections</option>
            <option value="ACADEMIC A">ACADEMIC A</option>
            <option value="ACADEMIC B">ACADEMIC B</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Search</label>
          <input type="text" id="filter-search" class="form-control" placeholder="Name or LRN…" />
        </div>
        <div class="form-group">
          <label class="form-label">&nbsp;</label>
          <button id="btn-autofix-all">✨ Auto-Fix All</button>
        </div>
      </div>
    </div>

    <div id="results-area">
      <div class="card" style="text-align:center;padding:40px;color:#90a4ae;">⏳ Loading from cloud...</div>
    </div>
  </main>

  <footer class="app-footer"><p>General Science Online Modular Application · <span class="version">v1.0.10</span></p></footer>

  <script src="../config.js?v=1.0.10"></script>
  <script src="../assets/js/app.js?v=1.0.10"></script>
  <script src="../assets/js/store.js?v=1.0.10"></script>
  <script src="../assets/js/security.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-auth.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-auth-boot.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-cloud.js?v=1.0.10"></script>
  
  <script>
    (function() {
      'use strict';

      let allStudents = [];

      TeacherAuthBoot.ready(async function(auth) {
        if (!auth.isAuthenticated()) { window.location.replace('../teacher-login.html'); return; }
        document.getElementById('btn-logout').addEventListener('click', function() { auth.logout(); });
        document.getElementById('btn-autofix-all').addEventListener('click', autoFixAll);
        document.getElementById('filter-section').addEventListener('change', render);
        document.getElementById('filter-search').addEventListener('input', render);

        try {
          allStudents = await TeacherCloud.fetchStudents();
          render();
        } catch (err) {
          document.getElementById('results-area').innerHTML = `<div class="card" style="text-align:center;padding:40px;color:#c62828;">❌ ${err.message}</div>`;
        }
      });

      function render() {
        const sectionFilter = document.getElementById('filter-section').value;
        const search = document.getElementById('filter-search').value.trim().toLowerCase();
        
        let filtered = allStudents;
        if (sectionFilter) filtered = filtered.filter(s => s.section === sectionFilter);
        if (search) {
          filtered = filtered.filter(s => 
            ((s.lastName || '') + ' ' + (s.firstName || '')).toLowerCase().includes(search) || 
            String(s.lrn).includes(search)
          );
        }
        filtered.sort((a, b) => (a.lastName || '').localeCompare(b.lastName || ''));

        const area = document.getElementById('results-area');
        if (!filtered.length) { area.innerHTML = '<div class="card" style="text-align:center;padding:40px;">👥 No students found.</div>'; return; }

        area.innerHTML = filtered.map(s => {
          const initials = ((s.firstName || '?').charAt(0) + (s.lastName || '?').charAt(0)).toUpperCase();
          return `
            <div class="nn-row" data-lrn="${s.lrn}">
              <div style="width:40px;height:40px;border-radius:50%;background:#0d47a1;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;">${initials}</div>
              <div><div class="nn-cell-label">Last Name</div><input class="nn-input" type="text" data-field="lastName" value="${s.lastName || ''}" /></div>
              <div><div class="nn-cell-label">First Name</div><input class="nn-input" type="text" data-field="firstName" value="${s.firstName || ''}" /></div>
              <div><div class="nn-cell-label">Middle Name</div><input class="nn-input" type="text" data-field="middleName" value="${s.middleName || ''}" /></div>
              <div><div class="nn-cell-label">LRN</div><div style="font-family:monospace;padding:8px 10px;background:#f5f7fa;border-radius:6px;">${s.lrn}</div></div>
              <div><button class="btn btn-primary" style="width:100%;font-size:0.75rem;padding:6px;" onclick="saveStudent('${s.lrn}')">💾 Save</button></div>
            </div>
          `;
        }).join('');
      }

      window.saveStudent = async function(lrn) {
        const row = document.querySelector(`.nn-row[data-lrn="${lrn}"]`);
        if (!row) return;
        const inputs = row.querySelectorAll('.nn-input');
        const student = allStudents.find(s => s.lrn === lrn);
        
        const updates = {};
        inputs.forEach(i => {
          const f = i.dataset.field;
          if (f === 'lastName') updates[f] = i.value.trim().toUpperCase();
          else updates[f] = i.value.trim().replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
        });

        try {
          const res = await fetch(CONFIG.BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'syncStudentProgress',
              lrn: lrn,
              progressJSON: student.progress || {}, // Preserve progress
              studentInfo: {
                lastName: updates.lastName,
                firstName: updates.firstName,
                middleName: updates.middleName,
                sex: student.sex,
                section: student.section
              }
            })
          });
          const data = await res.json();
          if (data.ok) {
            alert('✅ Name saved to backend!');
            Object.assign(student, updates); // update local array
            render();
          } else {
            alert('❌ Save failed: ' + data.error);
          }
        } catch (err) {
          alert('❌ Error: ' + err.message);
        }
      };

      async function autoFixAll() {
        if (!confirm('Apply normalized formatting to ALL students? This will save directly to the backend.')) return;
        let fixed = 0;
        for (const s of allStudents) {
          const updates = {
            lastName: (s.lastName || '').trim().toUpperCase(),
            firstName: (s.firstName || '').trim().replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase()),
            middleName: (s.middleName || '').trim().replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase())
          };
          if (updates.lastName !== s.lastName || updates.firstName !== s.firstName) {
            try {
              await fetch(CONFIG.BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({
                  action: 'syncStudentProgress',
                  lrn: s.lrn,
                  progressJSON: s.progress || {},
                  studentInfo: { lastName: updates.lastName, firstName: updates.firstName, middleName: updates.middleName, sex: s.sex, section: s.section }
                })
              });
              Object.assign(s, updates);
              fixed++;
            } catch (e) {}
          }
        }
        alert(`✅ Fixed ${fixed} students!`);
        render();
      }
    })();
  </script>
</body>
</html>

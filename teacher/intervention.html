<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intervention — Teacher · General Science</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=1.3.0-158faf5" />
  <link rel="stylesheet" href="../assets/css/teacher.css?v=1.3.0-158faf5" />
  <style>
    .iv-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 24px; align-items: end; }
    .iv-filters button { width: 100%; padding: 10px 12px; background: #0d47a1; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    
    .iv-bucket-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .iv-bucket { padding: 16px; border-radius: 12px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-left: 5px solid #90a4ae; cursor: pointer; transition: all 0.2s ease; }
    .iv-bucket:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); }
    .iv-bucket.active { box-shadow: 0 0 0 3px rgba(13,71,161,0.2); }
    .iv-bucket.enrichment { border-left-color: #2e7d32; }
    .iv-bucket.on-track { border-left-color: #0277bd; }
    .iv-bucket.remediation { border-left-color: #ed6c02; }
    .iv-bucket.urgent { border-left-color: #c62828; }
    .iv-bucket .count { font-size: 1.8rem; font-weight: 800; line-height: 1; margin-top: 8px; }
    .iv-bucket .label { font-size: 0.72rem; font-weight: 700; color: #5f6368; text-transform: uppercase; margin-top: 6px; }
    
    .iv-card { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; border-left: 4px solid #90a4ae; box-shadow: 0 1px 4px rgba(0,0,0,0.04); }
    .iv-card.enrichment { border-left-color: #2e7d32; }
    .iv-card.on-track { border-left-color: #0277bd; }
    .iv-card.remediation { border-left-color: #ed6c02; }
    .iv-card.urgent { border-left-color: #c62828; }
    .iv-student-head { display: flex; align-items: center; gap: 14px; margin-bottom: 10px; flex-wrap: wrap; }
    .iv-suggested { font-size: 0.85rem; padding: 12px 14px; background: #f5f7fa; border-radius: 8px; color: #37474f; line-height: 1.6; margin-top: 10px; }
    .iv-suggested ul { margin: 6px 0 0 20px; }
    
    @media (max-width: 600px) {
      .iv-filters { grid-template-columns: 1fr; }
      .iv-filters select, .iv-filters button { font-size: 16px; }
      .iv-student-head { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div><h1>🎯 Intervention</h1><span class="version">v1.0.10</span></div>
      <nav class="teacher-nav">
        <a href="../instructor.html">🏠 Dashboard</a>
        <a href="../classrecord.html">📊 Class Record</a>
        <button id="btn-logout">🚪 Logout</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">
    <div class="teacher-hero" style="padding:24px;">
      <div class="teacher-hero-content" style="align-items:flex-start;">
        <div class="teacher-hero-text">
          <h1 style="font-size:1.4rem;">Performance Intervention</h1>
          <p>Classify students by performance and generate targeted intervention plans per term.</p>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="iv-filters">
        <div class="form-group">
          <label class="form-label">Term</label>
          <select id="filter-term" class="form-control">
            <option value="term1">Term 1</option>
            <option value="term2">Term 2</option>
            <option value="term3">Term 3</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Section</label>
          <select id="filter-section" class="form-control">
            <option value="">All Sections</option>
            <option value="ACADEMIC A">ACADEMIC A</option>
            <option value="ACADEMIC B">ACADEMIC B</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">&nbsp;</label>
          <button id="btn-run">🔄 Compute</button>
        </div>
      </div>
    </div>

    <div id="buckets-area" style="display:none;">
      <div class="iv-bucket-grid" id="bucket-grid"></div>
    </div>

    <div id="students-area">
      <div class="card" style="text-align:center;padding:40px;color:#90a4ae;">
        <div style="font-size:2.5rem;margin-bottom:12px;">⏳</div>
        <p>Loading from cloud...</p>
      </div>
    </div>
  </main>

  <footer class="app-footer"><p>General Science Online Modular Application · <span class="version">v1.0.10</span></p></footer>

  <script src="../config.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/app.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/store.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/security.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/transmutation.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/teacher-auth.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/teacher-auth-boot.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/teacher-cloud.js?v=1.3.0-158faf5"></script>
  
  <script>
    (function() {
      'use strict';

      let allStudents = [];
      let currentBuckets = null;
      let activeBucket = 'all';
      let allClassified = [];

      TeacherAuthBoot.ready(async function(auth) {
        if (!auth.isAuthenticated()) { window.location.replace('../teacher-login.html'); return; }
        document.getElementById('btn-logout').addEventListener('click', function() { auth.logout(); });
        document.getElementById('btn-run').addEventListener('click', computeIntervention);

        document.getElementById('students-area').innerHTML = '<div class="card" style="text-align:center;padding:40px;">⏳ Fetching students from cloud...</div>';
        
        try {
          allStudents = await TeacherCloud.fetchStudents();
          document.getElementById('students-area').innerHTML = '<div class="card" style="text-align:center;padding:40px;color:#90a4ae;">Click <strong>Compute</strong> to classify.</div>';
        } catch (err) {
          document.getElementById('students-area').innerHTML = `<div class="card" style="text-align:center;padding:40px;color:#c62828;">❌ ${err.message}</div>`;
        }
      });

      function computeIntervention() {
        const term = document.getElementById('filter-term').value;
        const sectionFilter = document.getElementById('filter-section').value;

        let students = allStudents;
        if (sectionFilter) students = students.filter(s => s.section === sectionFilter);

        if (!students.length) {
          document.getElementById('students-area').innerHTML = '<div class="card" style="text-align:center;padding:40px;">👥 No students found.</div>';
          return;
        }

        allClassified = students.map(s => {
          const p = s.progress || {};
          const scores = p.scores?.[term] || {};
          const st = scores.st || {};
          const quizzes = scores.quizzes || {};

          let pcts = [];
          Object.values(st).forEach(r => { if (r && r.total) pcts.push((r.score / r.total) * 100); });
          Object.values(quizzes).forEach(r => { if (r && r.total) pcts.push((r.score / r.total) * 100); });
          
          const avg = pcts.length ? pcts.reduce((a, b) => a + b, 0) / pcts.length : null;
          const classification = avg !== null ? Transmutation.classifyStudent(avg) : { label: 'No data yet', key: 'on-track' };
          
          const progress = p.progress?.[term]?.completed || [];
          return { student: s, avg, classification, stCount: Object.keys(st).length, quizCount: Object.keys(quizzes).length, daysDone: progress.length };
        });

        const order = { urgent: 0, remediation: 1, 'on-track': 2, enrichment: 3 };
        allClassified.sort((a, b) => {
          let diff = (order[a.classification.key] || 99) - (order[b.classification.key] || 99);
          if (diff !== 0) return diff;
          return (a.avg === null ? 100 : a.avg) - (b.avg === null ? 100 : b.avg);
        });

        currentBuckets = {
          enrichment: allClassified.filter(x => x.classification.key === 'enrichment'),
          'on-track': allClassified.filter(x => x.classification.key === 'on-track'),
          remediation: allClassified.filter(x => x.classification.key === 'remediation'),
          urgent: allClassified.filter(x => x.classification.key === 'urgent')
        };

        activeBucket = 'all';
        renderBuckets();
        renderStudents();
      }

      function renderBuckets() {
        const grid = document.getElementById('bucket-grid');
        document.getElementById('buckets-area').style.display = 'block';
        const all = allClassified.length;
        
        const cards = [
          { key: 'all', label: 'All Students', color: '#0d47a1', count: all },
          { key: 'enrichment', label: 'Enrichment', color: '#2e7d32', count: currentBuckets.enrichment.length },
          { key: 'on-track', label: 'On Track', color: '#0277bd', count: currentBuckets['on-track'].length },
          { key: 'remediation', label: 'Remediation', color: '#ed6c02', count: currentBuckets.remediation.length },
          { key: 'urgent', label: 'Urgent', color: '#c62828', count: currentBuckets.urgent.length }
        ];
        
        grid.innerHTML = cards.map(b => `
          <div class="iv-bucket ${b.key} ${activeBucket === b.key ? 'active' : ''}" data-bucket="${b.key}" ${b.key === 'all' ? 'style="border-left-color:#0d47a1;"' : ''}>
            <div class="count" style="color:${b.color};">${b.count}</div>
            <div class="label">${b.label}</div>
          </div>
        `).join('');

        grid.querySelectorAll('[data-bucket]').forEach(el => {
          el.addEventListener('click', function() {
            activeBucket = el.dataset.bucket;
            renderBuckets();
            renderStudents();
          });
        });
      }

      function renderStudents() {
        const area = document.getElementById('students-area');
        const term = document.getElementById('filter-term').value;
        const list = activeBucket === 'all' ? allClassified : (currentBuckets[activeBucket] || []);

        if (!list.length) { area.innerHTML = '<div class="card" style="text-align:center;padding:40px;">📭 No students here.</div>'; return; }

        area.innerHTML = list.map(entry => {
          const s = entry.student;
          const cls = entry.classification;
          const initials = ((s.firstName || '?').charAt(0) + (s.lastName || '?').charAt(0)).toUpperCase();
          const avgDisplay = entry.avg !== null ? entry.avg.toFixed(1) + '%' : '—';
          
          return `
            <div class="iv-card ${cls.key}">
              <div class="iv-student-head">
                <div style="width:36px; height:36px; border-radius:50%; background:#0d47a1; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:0.8rem;">${initials}</div>
                <div style="flex:1; min-width:180px;">
                  <div style="font-weight:700; font-size:1rem;">${s.lastName}, ${s.firstName}</div>
                  <div style="font-size:0.78rem; color:#78909c;">LRN: ${s.lrn} · ${s.section}</div>
                </div>
                <span class="badge" style="background:${cls.key==='urgent'?'#ffebee':cls.key==='remediation'?'#fff3e0':'#e8f5e9'}; color:${cls.key==='urgent'?'#c62828':cls.key==='remediation'?'#e65100':'#1b5e20'}; font-weight:700;">${cls.label}</span>
              </div>
              <div style="display:flex; gap:16px; flex-wrap:wrap; font-size:0.82rem; margin:8px 0;">
                <div><strong>Avg:</strong> <span style="color:${entry.avg>=75?'#2e7d32':'#c62828'}; font-weight:700;">${avgDisplay}</span></div>
                <div><strong>Quizzes:</strong> ${entry.quizCount}/3</div>
                <div><strong>STs:</strong> ${entry.stCount}/2</div>
                <div><strong>Days done:</strong> ${entry.daysDone}/40</div>
              </div>
              <div class="iv-suggested"><strong>📋 Action Plan:</strong> ${getInterventionText(entry)}</div>
            </div>
          `;
        }).join('');
      }

      function getInterventionText(entry) {
        const cls = entry.classification.key;
        let act = [];
        if (cls === 'enrichment') act.push('Offer advanced tasks, science fairs, or peer tutoring roles.');
        else if (cls === 'on-track') act.push('Maintain pace, provide occasional challenge problems.');
        else if (cls === 'remediation') act.push('Schedule small-group sessions, allow activity retakes.');
        else if (cls === 'urgent') act.push('One-on-one conference, identify root causes, create catch-up plan.');
        
        if (entry.quizCount < 3) act.push(`Attempt ${3 - entry.quizCount} more quiz(zes).`);
        if (entry.daysDone < 20) act.push(`Complete ${20 - entry.daysDone} more days.`);
        
        return '<ul>' + act.map(a => `<li>${a}</li>`).join('') + '</ul>';
      }
    })();
  </script>
</body>
</html>

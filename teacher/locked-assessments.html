<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Locked Assessments — Teacher · General Science</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=1.0.10" />
  <link rel="stylesheet" href="../assets/css/teacher.css?v=1.0.10" />
  <style>
    .la-filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 24px; align-items: end; }
    .la-filters button { width: 100%; padding: 10px 12px; background: #0d47a1; color: #fff; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .lock-card { background: #fff; border-radius: 12px; padding: 18px 20px; margin-bottom: 12px; border-left: 5px solid #c62828; box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: all 0.15s; }
    .lock-card.tampered { border-left-color: #6a1b9a; }
    .lock-head { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
    .lock-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.82rem; color: #37474f; padding: 10px 14px; background: #fafbfc; border-radius: 8px; margin-bottom: 10px; }
    .lock-reason { font-size: 0.82rem; padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; line-height: 1.5; }
    .lock-reason.failed { background: #fff3e0; border-left: 3px solid #ed6c02; color: #e65100; }
    .lock-reason.tampered { background: #f3e5f5; border-left: 3px solid #6a1b9a; color: #4a148c; }
    .lock-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .la-empty { text-align: center; padding: 48px 24px; color: #90a4ae; }
    .la-empty.success { color: #2e7d32; }
    @media (max-width: 600px) {
      .la-filters { grid-template-columns: 1fr; }
      .la-filters select, .la-filters button { font-size: 16px; }
    }
  </style>
</head>
<body>

  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div><h1>🔒 Locked Assessments</h1><span class="version">v1.0.10</span></div>
      <nav class="teacher-nav">
        <a href="../instructor.html">🏠 Dashboard</a>
        <a href="../classrecord.html">📊 Class Record</a>
        <button id="btn-logout">🚪 Logout</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">
    <div class="teacher-hero" style="padding:24px;">
      <div class="teacher-hero-content" style="align-items:flex-start;">
        <div class="teacher-hero-text">
          <h1 style="font-size:1.4rem;">Locked Assessments Review</h1>
          <p>Pulls locks from the backend — sees failed attempts from all student devices. Unlock reaches the student within ~15 seconds.</p>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="la-filters">
        <div class="form-group">
          <label class="form-label">Term</label>
          <select id="filter-term" class="form-control">
            <option value="">All Terms</option>
            <option value="term1">Term 1</option>
            <option value="term2">Term 2</option>
            <option value="term3">Term 3</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Section</label>
          <select id="filter-section" class="form-control">
            <option value="">All Sections</option>
            <option value="ACADEMIC A">ACADEMIC A</option>
            <option value="ACADEMIC B">ACADEMIC B</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">&nbsp;</label>
          <button id="btn-refresh">🔄 Refresh</button>
        </div>
      </div>
    </div>

    <div id="results-area">
      <div class="card la-empty">⏳ Loading from cloud...</div>
    </div>
  </main>

  <footer class="app-footer"><p>General Science Online Modular Application · <span class="version">v1.0.10</span></p></footer>

  <script src="../config.js?v=1.0.10"></script>
  <script src="../assets/js/app.js?v=1.0.10"></script>
  <script src="../assets/js/store.js?v=1.0.10"></script>
  <script src="../assets/js/security.js?v=1.0.10"></script>
  <script src="../assets/js/sync.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-auth.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-auth-boot.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-cloud.js?v=1.0.10"></script>
  <script>
    (function() {
      'use strict';

      const LABELS = {
        quiz1: 'Quiz 1', quiz2: 'Quiz 2', quiz3: 'Quiz 3',
        st1: 'Summative Test 1', st2: 'Summative Test 2', te: 'Term Exam'
      };

      let allStudents = [];

      TeacherAuthBoot.ready(async function(auth) {
        if (!auth.isAuthenticated()) { window.location.replace('../teacher-login.html'); return; }
        document.getElementById('btn-logout').addEventListener('click', function() { auth.logout(); });
        document.getElementById('btn-refresh').addEventListener('click', render);

        try {
          allStudents = await TeacherCloud.fetchStudents();
          render();
        } catch (err) {
          document.getElementById('results-area').innerHTML = `<div class="card la-empty" style="color:#c62828;">❌ ${err.message}</div>`;
        }
      });

      async function render() {
        const area = document.getElementById('results-area');
        area.innerHTML = '<div class="card la-empty">⏳ Loading locks from backend…</div>';

        if (typeof Sync === 'undefined' || !Sync.backendEnabled()) {
          area.innerHTML = '<div class="card la-empty" style="color:#c62828;">⚠️ Backend not configured.</div>';
          return;
        }

        const termFilter = document.getElementById('filter-term').value;
        const sectionFilter = document.getElementById('filter-section').value;

        const filters = {};
        if (termFilter) filters.term = termFilter;
        if (sectionFilter) filters.section = sectionFilter;

        try {
          const res = await Sync.pullLocks(filters);
          if (!res.ok) throw new Error(res.error || 'Unknown error');
          
          const byLrn = {};
          allStudents.forEach(s => { byLrn[s.lrn] = s; });

          let found = [];
          (res.records || []).forEach(lock => {
            const student = byLrn[lock.lrn];
            if (student) {
              found.push({
                student,
                term: lock.term,
                assessmentId: lock.assessment,
                assessmentLabel: LABELS[lock.assessment] || lock.assessment,
                lockId: lock.lockId,
                lockData: { reason: lock.reason, score: lock.score, lockedAt: lock.lockedAt }
              });
            }
          });

          found.sort((a, b) => (a.student.lastName || '').localeCompare(b.student.lastName || ''));

          if (!found.length) {
            area.innerHTML = '<div class="card la-empty success"><div style="font-size:3rem;margin-bottom:12px;">✅</div><strong>No locked assessments</strong><p>All clear!</p></div>';
            return;
          }

          let grouped = {};
          found.forEach(l => {
            if (!grouped[l.student.lrn]) grouped[l.student.lrn] = [];
            grouped[l.student.lrn].push(l);
          });

          let failedCount = found.filter(l => l.lockData.reason === 'failed').length;
          let tamperedCount = found.filter(l => l.lockData.reason === 'tab-switch').length;

          let html = `
            <div class="stats-grid" style="margin-bottom:20px;">
              <div class="stat-card red"><div class="stat-icon">🔒</div><div class="stat-value">${found.length}</div><div class="stat-label">Total Locked</div></div>
              <div class="stat-card amber"><div class="stat-icon">👥</div><div class="stat-value">${Object.keys(grouped).length}</div><div class="stat-label">Students</div></div>
              <div class="stat-card blue"><div class="stat-icon">📝</div><div class="stat-value">${failedCount}</div><div class="stat-label">Failed</div></div>
              <div class="stat-card purple"><div class="stat-icon">⚠️</div><div class="stat-value">${tamperedCount}</div><div class="stat-label">Tampered</div></div>
            </div>
          `;

          Object.keys(grouped).forEach(lrn => {
            const items = grouped[lrn];
            const s = items[0].student;
            const initials = ((s.firstName || '?').charAt(0) + (s.lastName || '?').charAt(0)).toUpperCase();
            html += `
              <div style="margin-bottom:24px;">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;padding:12px 16px;background:#f5f7fa;border-radius:10px;">
                  <div class="student-avatar" style="width:40px;height:40px;font-size:0.85rem;background:#0d47a1;">${initials}</div>
                  <div style="flex:1;min-width:180px;">
                    <div style="font-weight:700;font-size:1rem;">${s.lastName}, ${s.firstName}</div>
                    <div style="font-size:0.75rem;color:#78909c;">LRN: ${s.lrn} · ${s.section}</div>
                  </div>
                </div>
                ${items.map(renderLockCard).join('')}
              </div>
            `;
          });

          area.innerHTML = html;
          area.querySelectorAll('[data-unlock]').forEach(btn => {
            btn.addEventListener('click', () => promptUnlock(btn.dataset));
          });

        } catch (err) {
          area.innerHTML = `<div class="card la-empty" style="color:#c62828;">⚠️ ${err.message}</div>`;
        }
      }

      function renderLockCard(l) {
        const isTampered = l.lockData.reason === 'tab-switch';
        const termLabel = l.term.replace('term', 'Term ');
        const lockedDate = l.lockData.lockedAt ? new Date(l.lockData.lockedAt).toLocaleDateString() : '—';
        const score = l.lockData.score != null ? l.lockData.score + '%' : '—';

        return `<div class="lock-card ${isTampered ? 'tampered' : ''}">
          <div class="lock-head">
            <span style="font-size:1.4rem;">${isTampered ? '⚠️' : '🔒'}</span>
            <div style="flex:1;">
              <div style="font-weight:700;">${l.assessmentLabel}</div>
              <div style="font-size:0.78rem;color:#78909c;">${termLabel} · Locked on ${lockedDate}</div>
            </div>
            <span class="badge" style="background:${isTampered?'#f3e5f5':'#fff3e0'};color:${isTampered?'#6a1b9a':'#e65100'};">${isTampered?'Tampered':'Failed'}</span>
          </div>
          <div class="lock-meta">
            <div><strong>Score at lock:</strong> ${score}</div>
            <div><strong>Reason:</strong> ${isTampered ? 'Tab-switch' : 'Below passing'}</div>
          </div>
          <div class="lock-reason ${isTampered?'tampered':'failed'}">
            ${isTampered ? '⚠️ Auto-locked due to tab-switching.' : '📖 Below passing score.'}
          </div>
          <div class="lock-actions">
            <button class="btn btn-primary" style="padding:8px 18px;font-size:0.85rem;" 
              data-lock-id="${l.lockId}" 
              data-student="${l.student.lrn}" 
              data-label="${l.assessmentLabel}" 
              data-term="${l.term}" 
              data-assessment="${l.assessmentId}">
              🔓 Unlock for Retake
            </button>
          </div>
        </div>`;
      }

      async function promptUnlock(dataset) {
        if (!confirm(`Unlock "${dataset.label}" for this student?\nThis reaches their device within 15 seconds.`)) return;
        try {
          const res = await Sync.pushUnlock(dataset.student, dataset.term, dataset.assessment, {
            reason: 'retake-approved',
            unlockedBy: 'teacher',
            forceUnlock: false
          });
          if (res.ok) {
            if (dataset.lockId) await Sync.deleteLock(dataset.lockId);
            alert('✅ Unlocked successfully! Student can now retake.');
          } else {
            alert('❌ Failed: ' + (res.error || 'Unknown'));
          }
        } catch (err) {
          alert('❌ Error: ' + err.message);
        }
        render();
      }
    })();
  </script>
</body>
</html>

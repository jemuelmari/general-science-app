<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Evidence — General Science</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=1.3.0-158faf5" />
  <link rel="stylesheet" href="../assets/css/teacher.css?v=1.3.0-158faf5" />
  <link rel="stylesheet" href="../assets/css/evidence-print.css?v=1.3.0-158faf5" />
  <style>
    .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
    @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } .ev-actions { flex-direction: column; } .ev-actions button { width: 100%; } }
  </style>
</head>
<body>
  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div>
        <h1>📄 Exam Evidence Generator</h1>
        <span class="version">v1.0.17</span>
      </div>
      <nav class="teacher-nav">
        <a href="../instructor.html">🏠 Dashboard</a>
        <a href="../classrecord.html">📊 Class Record</a>
        <a href="evidence.html" style="color:#ffd54f;border-color:#ffd54f;">📄 Exam Evidence</a>
        <button id="btn-logout">🚪 Logout</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">
    <div class="card" style="padding:24px;margin-bottom:20px;">
      <h2 style="margin:0 0 6px;color:#0d47a1;">Generate Printable Exam Evidence</h2>
      <p style="color:#546e7a;margin:0 0 20px;font-size:0.9rem;">Create a Word (.docx) file per student showing their full exam — questions, answers, correct answers, score, and signature blocks.</p>

      <div class="form-row">
        <div>
          <label style="display:block;font-size:0.8rem;font-weight:600;color:#37474f;margin-bottom:6px;">Student</label>
          <select id="ev-student" class="form-control" style="width:100%;padding:10px 12px;">
            <option value="">— Fetching from Cloud... —</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.8rem;font-weight:600;color:#37474f;margin-bottom:6px;">Term</label>
          <select id="ev-term" class="form-control" style="width:100%;padding:10px 12px;">
            <option value="1">Term 1</option>
            <option value="2">Term 2</option>
            <option value="3">Term 3</option>
          </select>
        </div>
        <div>
          <label style="display:block;font-size:0.8rem;font-weight:600;color:#37474f;margin-bottom:6px;">Assessment Type</label>
          <select id="ev-type" class="form-control" style="width:100%;padding:10px 12px;">
            <option value="">— Select type —</option>
            <option value="st">Summative Test (ST)</option>
            <option value="quiz">Quiz</option>
            <option value="te">Term Exam (TE)</option>
          </select>
        </div>
        <div id="ev-index-wrap" style="display:none;">
          <label style="display:block;font-size:0.8rem;font-weight:600;color:#37474f;margin-bottom:6px;">Assessment #</label>
          <select id="ev-index" class="form-control" style="width:100%;padding:10px 12px;">
            <option value="">— Select # —</option>
          </select>
        </div>
      </div>

      <div class="ev-actions" style="margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
        <button id="ev-generate" style="padding:12px 22px;font-weight:600;background:#0d47a1;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:0.9rem;">📄 Generate Evidence (.docx)</button>
        <span id="ev-status" style="font-size:0.85rem;color:#546e7a;"></span>
      </div>
    </div>
  </main>

  <footer class="app-footer"><p>General Science Online Modular Application · <span class="version">v1.0.17</span></p></footer>

  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <script src="../config.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/app.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/store.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/security.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/teacher-auth.js?v=1.3.0-158faf5"></script>
  <script src="../assets/js/teacher-auth-boot.js?v=1.3.0-158faf5"></script>
  <!-- ITO ANG INayos: Tinuro na sa katabing file (teacher/evidence.js) -->
  <script src="evidence.js?v=1.3.0-158faf5"></script>
  
  <script>
    (function() {
      'use strict';
      let allStudents = [];

      TeacherAuthBoot.ready(async function(auth) {
        if (!auth.isAuthenticated()) { window.location.replace('../teacher-login.html'); return; }
        document.getElementById('btn-logout').addEventListener('click', function() { auth.logout(); });
        
        const sel = document.getElementById('ev-student');
        sel.innerHTML = '<option value="">— Fetching from Cloud... —</option>';

        try {
          const res = await fetch(CONFIG.BACKEND_URL, {
            method: 'POST',
            body: JSON.stringify({ action: 'pullTeacherDashboard', token: sessionStorage.getItem('gsa_teacher_token') || CONFIG.TEACHER_PASSWORD_HASH })
          });
          const data = await res.json();
          
          if (data.ok && data.students && data.students.length > 0) allStudents = data.students;
          else if (data.ok && data.records && data.records.length > 0) allStudents = data.records; 
          else throw new Error(data.error || 'No students returned.');

          allStudents.sort((a, b) => (a.lastName || '').localeCompare(b.lastName || ''));
          sel.innerHTML = '<option value="">— Select student —</option>' + 
            allStudents.map(s => `<option value="${s.lrn}">${s.lastName}, ${s.firstName} (${s.section || 'No section'})</option>`).join('');
        } catch (err) {
          sel.innerHTML = '<option value="">— Error: ' + err.message + ' —</option>';
        }

        document.getElementById('ev-type').addEventListener('change', function() {
          const type = this.value;
          const wrap = document.getElementById('ev-index-wrap');
          const idx = document.getElementById('ev-index');
          if (type === 'st' || type === 'quiz') {
            wrap.style.display = 'block';
            idx.innerHTML = type === 'st' 
              ? '<option value="1">ST 1</option><option value="2">ST 2</option>'
              : '<option value="1">Quiz 1</option><option value="2">Quiz 2</option><option value="3">Quiz 3</option>';
          } else {
            wrap.style.display = 'none';
          }
        });

        document.getElementById('ev-generate').addEventListener('click', async function() {
          const lrn = document.getElementById('ev-student').value;
          const term = document.getElementById('ev-term').value;
          const type = document.getElementById('ev-type').value;
          const idx = document.getElementById('ev-index').value;
          const btn = this;
          const status = document.getElementById('ev-status');

          if (!lrn || !term || !type) {
            alert('Please select student, term, and assessment type.');
            return;
          }

          const student = allStudents.find(s => String(s.lrn) === String(lrn));
          if (!student) return;

          btn.disabled = true;
          btn.textContent = '⏳ Generating...';
          status.textContent = '';

          try {
            const ok = await window.Evidence.generateOne(student, term, type, idx);
            if (ok) status.textContent = '✅ Success! File downloaded.';
          } catch (err) {
            alert('Error: ' + err.message);
          } finally {
            btn.disabled = false;
            btn.textContent = '📄 Generate Evidence (.docx)';
          }
        });
      });
    })();
  </script>
</body>
</html>

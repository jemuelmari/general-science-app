<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exam Evidence — Teacher</title>
  <link rel="stylesheet" href="../assets/css/main.css?v=1.0.10" />
  <link rel="stylesheet" href="../assets/css/teacher.css?v=1.0.10" />
  <script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
  <style>
    .evidence-container { max-width: 900px; margin: 0 auto; padding: 20px; }
    .filter-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; background: #fff; padding: 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; align-items: end; }
    .filter-bar label { display: block; font-size: 0.75rem; font-weight: 700; color: #5f6368; text-transform: uppercase; margin-bottom: 6px; }
    .filter-bar select, .filter-bar button { width: 100%; padding: 10px 12px; border: 1.5px solid #cfd8dc; border-radius: 8px; font-family: inherit; font-size: 0.9rem; box-sizing: border-box; }
    .filter-bar button { background: #0d47a1; color: #fff; border: none; font-weight: 700; cursor: pointer; }
    
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .table-responsive table { width: 100%; min-width: 700px; border-collapse: collapse; font-size: 0.85rem; }
    .table-responsive th { background: #f5f7fa; text-align: left; padding: 12px 16px; font-size: 0.72rem; text-transform: uppercase; color: #5f6368; border-bottom: 2px solid #e0e0e0; }
    .table-responsive td { padding: 12px 16px; border-bottom: 1px solid #f0f0f0; }
    .btn-generate { padding: 6px 12px; background: #2e7d32; color: #fff; border: none; border-radius: 6px; font-size: 0.78rem; font-weight: 700; cursor: pointer; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }
    
    @media (max-width: 600px) {
      .filter-bar { padding: 12px; grid-template-columns: 1fr; }
      .filter-bar select, .filter-bar button { font-size: 16px; }
    }
  </style>
</head>
<body>
  <header class="app-header teacher-header">
    <div class="container flex-between">
      <div><h1>📄 Exam Evidence</h1><span class="version">v1.0.10</span></div>
      <nav class="teacher-nav">
        <a href="../instructor.html">🏠 Dashboard</a>
        <a href="../classrecord.html">📊 Class Record</a>
        <a href="pt-submissions.html">📋 PT Submissions</a>
        <button id="btn-logout">🚪 Logout</button>
      </nav>
    </div>
  </header>

  <main class="evidence-container">
    <div class="filter-bar">
      <div>
        <label>Term</label>
        <select id="filter-term">
          <option value="term1">Term 1</option>
          <option value="term2" selected>Term 2</option>
          <option value="term3">Term 3</option>
        </select>
      </div>
      <div>
        <label>Assessment</label>
        <select id="filter-assessment">
          <option value="st1">Summative Test 1</option>
          <option value="st2">Summative Test 2</option>
          <option value="te">Term Exam</option>
        </select>
      </div>
      <button id="btn-load">📋 Load Students</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Student Name</th>
            <th>LRN</th>
            <th>Score</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="evidence-body">
          <tr><td colspan="4" style="text-align:center;padding:40px;color:#90a4ae;">Select a term and click Load.</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer class="app-footer"><p>General Science Online Modular Application · <span class="version">v1.0.10</span></p></footer>

  <script src="../config.js?v=1.0.10"></script>
  <script src="../assets/js/app.js?v=1.0.10"></script>
  <script src="../assets/js/store.js?v=1.0.10"></script>
  <script src="../assets/js/security.js?v=1.0.10"></script>
  <script src="../assets/js/sync.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-auth.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-auth-boot.js?v=1.0.10"></script>
  <script src="../assets/js/teacher-cloud.js?v=1.0.10"></script>
  
  <script>
    (function() {
      'use strict';
      let allStudents = [];

      async function loadData() {
        const term = document.getElementById('filter-term').value;
        const assessment = document.getElementById('filter-assessment').value;
        const tbody = document.getElementById('evidence-body');
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;">⏳ Fetching from cloud...</td></tr>';

        try {
          if (!allStudents.length) {
            allStudents = await TeacherCloud.fetchStudents();
          }
          
          if (!allStudents.length) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:40px;">📭 No students found.</td></tr>';
            return;
          }

          tbody.innerHTML = allStudents.map(s => {
            const p = s.progress || {};
            const scores = p.scores?.[term] || {};
            let record = null;
            if (assessment === 'te') record = scores.te;
            else record = scores.st?.[assessment];
            
            const score = record ? (record.score + '/' + record.total) : '—';

            return `<tr>
              <td><strong>${s.lastName}, ${s.firstName}</strong></td>
              <td>${s.lrn}</td>
              <td>${score}</td>
              <td><button class="btn-generate" onclick="generateDocx('${s.lrn}', '${term}', '${assessment}')">📄 Download</button></td>
            </tr>`;
          }).join('');
        } catch (err) {
          tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:#c62828;">❌ ${err.message}</td></tr>`;
        }
      }

      document.getElementById('btn-load').addEventListener('click', loadData);
      document.getElementById('btn-logout').addEventListener('click', () => TeacherAuth.logout());

      // Initialize the docx generator (placeholder for now)
      window.generateDocx = function(lrn, term, assessment) {
        if (typeof docx === 'undefined') {
          alert('DOCX library not loaded.');
          return;
        }
        alert('Generating Word document for LRN ' + lrn + ' (Term ' + term + ', ' + assessment + ')...');
        // TODO: Implement actual docx generation with attempt data from backend
      };
    })();
  </script>
</body>
</html>

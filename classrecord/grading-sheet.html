<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grading Sheet — Class Record · General Science</title>
  <link rel="stylesheet" href="../assets/css/main.css" />
  <link rel="stylesheet" href="../assets/css/classrecord.css" />
  <style>
    .gs-filter-bar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
      background: #fff;
      padding: 18px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
    }
    .gs-filter-bar .form-group {
      min-width: 180px;
      flex: 1;
      margin-bottom: 0;
    }

    .gs-student-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .gs-summary-card {
      background: #fff;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      border-left: 4px solid #00695c;
    }
    .gs-summary-card .lbl {
      font-size: 0.72rem;
      font-weight: 700;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .gs-summary-card .val {
      font-size: 1.8rem;
      font-weight: 800;
      line-height: 1.1;
      color: #1a1a1a;
      letter-spacing: -0.5px;
      margin-top: 6px;
    }
    .gs-summary-card .sub {
      font-size: 0.75rem;
      color: #90a4ae;
      margin-top: 4px;
    }
    .gs-summary-card.green  { border-left-color: #2e7d32; }
    .gs-summary-card.amber  { border-left-color: #ed6c02; }
    .gs-summary-card.red    { border-left-color: #c62828; }

    .gs-group {
      background: #fff;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      margin-bottom: 20px;
      border-top: 4px solid #00695c;
    }
    .gs-group.ww { border-top-color: #0d47a1; }
    .gs-group.pt { border-top-color: #00695c; }
    .gs-group.ex { border-top-color: #6a1b9a; }

    .gs-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .gs-group-title {
      font-size: 1rem;
      font-weight: 700;
      color: #004d40;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .gs-group.ww .gs-group-title { color: #0d47a1; }
    .gs-group.pt .gs-group-title { color: #00695c; }
    .gs-group.ex .gs-group-title { color: #6a1b9a; }

    .gs-weight-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e0f2f1;
      color: #004d40;
    }
    .gs-group.ww .gs-weight-badge { background: #e3f2fd; color: #0d47a1; }
    .gs-group.pt .gs-weight-badge { background: #e0f2f1; color: #004d40; }
    .gs-group.ex .gs-weight-badge { background: #f3e5f5; color: #6a1b9a; }

    .gs-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr 1.2fr;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #f5f5f5;
      align-items: center;
    }
    .gs-row:last-child { border-bottom: none; }
    .gs-row.header {
      border-bottom: 2px solid #e0e0e0;
      font-size: 0.72rem;
      font-weight: 700;
      color: #5f6368;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 8px 0;
    }
    .gs-row .label {
      font-size: 0.9rem;
      color: #37474f;
      font-weight: 600;
    }
    .gs-row .val {
      font-size: 0.92rem;
      color: #37474f;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .gs-row .val.missing { color: #bdbdbd; }
    .gs-row .val.pct {
      font-weight: 700;
    }
    .gs-row .val.pct.high  { color: #2e7d32; }
    .gs-row .val.pct.mid   { color: #0d47a1; }
    .gs-row .val.pct.low   { color: #ed6c02; }
    .gs-row .val.pct.crit  { color: #c62828; }

    .gs-empty {
      text-align: center;
      padding: 48px 24px;
      color: #90a4ae;
    }

    @media (max-width: 700px) {
      .gs-row {
        grid-template-columns: 1fr 1fr;
        row-gap: 6px;
      }
      .gs-row.header { display: none; }
      .gs-row .label::before { content: ''; }
    }
  </style>
</head>
<body>

  <header class="app-header classrecord-header">
    <div class="container flex-between">
      <div>
        <h1>📋 Grading Sheet</h1>
        <span class="version">v1.0.0</span>
      </div>
      <nav class="teacher-nav">
        <a href="../classrecord.html">← Class Record</a>
        <a href="../instructor.html">🏠 Dashboard</a>
        <button id="btn-logout">🚪 Logout</button>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top:24px;padding-bottom:64px;">

    <!-- Filters -->
    <div class="gs-filter-bar">
      <div class="form-group">
        <label class="form-label">Term</label>
        <select id="filter-term" class="form-control">
          <option value="term1">Term 1</option>
          <option value="term2">Term 2</option>
          <option value="term3">Term 3</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Section</label>
        <select id="filter-section" class="form-control">
          <option value="">All Sections</option>
          <option value="ACADEMIC A">ACADEMIC A</option>
          <option value="ACADEMIC B">ACADEMIC B</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Student</label>
        <select id="filter-student" class="form-control">
          <option value="">— Select a student —</option>
        </select>
      </div>
      <div class="form-group" style="flex:0;">
        <label class="form-label">&nbsp;</label>
        <button id="btn-refresh" class="btn btn-primary">🔄 Refresh</button>
      </div>
      <div class="form-group" style="flex:0;">
        <label class="form-label">&nbsp;</label>
        <button id="btn-export" class="btn btn-outline">📥 Export</button>
      </div>
    </div>

    <div id="results-area">
      <div class="card gs-empty">
        <div style="font-size:2.5rem;margin-bottom:12px;">📋</div>
        <p>Select a student to view their detailed grading sheet.</p>
      </div>
    </div>

  </main>

  <footer class="app-footer">
    <p>General Science Online Modular Application · <span class="version">v1.0.0</span></p>
  </footer>

  <script src="../config.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/store.js"></script>
  <script src="../assets/js/security.js"></script>
  <script src="../assets/js/transmutation.js"></script>
  <script src="../assets/js/teacher-auth-v2.js"></script>
  <script>
    (function() {
      'use strict';

      TeacherAuth.init();
      if (!TeacherAuth.require()) return;

      const WEIGHTS = (CONFIG && CONFIG.WEIGHTS) || { ww: 0.20, pt: 0.50, ex: 0.30 };
      const EX_INTERNAL = (CONFIG && CONFIG.EX_INTERNAL) || { st1: 0.30, st2: 0.30, te: 0.40 };

      /* ============================================================
         FILTERS
         ============================================================ */
      function refreshStudentDropdown() {
        const section = document.getElementById('filter-section').value;
        let students = Store.getAllUsers();
        if (section) students = students.filter((s) => s.section === section);
        students = APP.sortStudents(students, 'last', 'asc');

        const select = document.getElementById('filter-student');
        const currentValue = select.value;
        select.innerHTML = '<option value="">— Select a student —</option>';

        students.forEach((s) => {
          const opt = document.createElement('option');
          opt.value = s.lrn;
          opt.textContent = `${APP.formatFullName(s.lastName, s.firstName, s.middleName)} · ${s.section}`;
          select.appendChild(opt);
        });

        if (currentValue) select.value = currentValue;
      }

      /* ============================================================
         SCORE HELPERS
         ============================================================ */
      function getScore(lrn, term, type, id) {
        const scores = Store.getScores(lrn);
        const t = scores[term] || {};
        let record = null;
        if (type === 'te') record = t.te;
        else record = t[type]?.[id];
        return record || null;
      }

      function pctClass(pct) {
        if (pct == null) return '';
        if (pct >= 90) return 'high';
        if (pct >= 75) return 'mid';
        if (pct >= 65) return 'low';
        return 'crit';
      }

      /* ============================================================
         RENDER
         ============================================================ */
      function render() {
        const term = document.getElementById('filter-term').value;
        const lrn = document.getElementById('filter-student').value;
        const area = document.getElementById('results-area');

        if (!lrn) {
          area.innerHTML = `
            <div class="card gs-empty">
              <div style="font-size:2.5rem;margin-bottom:12px;">📋</div>
              <p>Select a student to view their detailed grading sheet.</p>
            </div>
          `;
          return;
        }

        const student = Store.getUser(lrn);
        if (!student) {
          area.innerHTML = `<div class="card gs-empty"><p>Student not found.</p></div>`;
          return;
        }

        const initials = `${(student.firstName || '?').charAt(0)}${(student.lastName || '?').charAt(0)}`.toUpperCase();
        const avatarClass = UI.getAvatarClass(student.lrn);
        const termLabel = term.replace('term', 'Term ');

        /* ----- Pull all scores ----- */
        const q1 = getScore(lrn, term, 'quizzes', 'quiz1');
        const q2 = getScore(lrn, term, 'quizzes', 'quiz2');
        const q3 = getScore(lrn, term, 'quizzes', 'quiz3');
        const st1 = getScore(lrn, term, 'st', 'st1');
        const st2 = getScore(lrn, term, 'st', 'st2');
        const pt1 = getScore(lrn, term, 'pt', 'pt1');
        const pt2 = getScore(lrn, term, 'pt', 'pt2');
        const pt3 = getScore(lrn, term, 'pt', 'pt3');
        const te = getScore(lrn, term, 'te', 'te');

        const qs = [q1, q2, q3];
        const sts = [st1, st2];
        const pts = [pt1, pt2, pt3];

        /* ----- Compute averages ----- */
        const quizPcts = qs.map((q) => q?.percent ?? (q?.score != null && q.total ? (q.score / q.total) * 100 : null)).filter((v) => v != null);
        const wwAvg = quizPcts.length ? quizPcts.reduce((a, b) => a + b, 0) / quizPcts.length : null;

        const ptPcts = pts.map((p) => p?.percent ?? (p?.score != null && p.total ? (p.score / p.total) * 100 : null)).filter((v) => v != null);
        const ptAvg = ptPcts.length ? ptPcts.reduce((a, b) => a + b, 0) / ptPcts.length : null;

        const st1Pct = st1?.percent ?? null;
        const st2Pct = st2?.percent ?? null;
        const tePct  = te?.percent ?? null;

        let exAvg = null;
        if (st1Pct != null && st2Pct != null && tePct != null) {
          exAvg = (st1Pct * EX_INTERNAL.st1) + (st2Pct * EX_INTERNAL.st2) + (tePct * EX_INTERNAL.te);
        }

        const final = Transmutation.computeFinalGrade(
          wwAvg ?? 0,
          ptAvg ?? 0,
          exAvg ?? 0,
          WEIGHTS
        );

        const classification = Transmutation.classifyStudent(
          [wwAvg, ptAvg, exAvg].filter((v) => v != null).reduce((a, b, _, arr) => a + b / arr.length, 0)
        );

        /* ----- Render ----- */
        area.innerHTML = `
          <!-- Student header -->
          <div class="card" style="padding:20px;margin-bottom:20px;">
            <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">
              <div class="student-avatar ${avatarClass}" style="width:56px;height:56px;font-size:1.1rem;">${initials}</div>
              <div style="flex:1;min-width:200px;">
                <div style="font-size:1.15rem;font-weight:700;color:#004d40;">
                  ${APP.formatFullName(student.lastName, student.firstName, student.middleName)}
                </div>
                <div style="font-size:0.82rem;color:#5f6368;margin-top:4px;">
                  LRN: ${APP.formatLRN(student.lrn)} · ${student.section} · ${APP.getSexValue(student.sex) || '—'}
                </div>
              </div>
              <span class="badge-pill ${classification.key === 'enrichment' ? 'success' : classification.key === 'on-track' ? 'info' : classification.key === 'remediation' ? 'warning' : 'danger'}">
                ${classification.label}
              </span>
            </div>
          </div>

          <!-- Summary cards -->
          <div class="gs-student-summary">
            <div class="gs-summary-card ${wwAvg != null && wwAvg >= 75 ? 'green' : wwAvg != null ? 'amber' : ''}">
              <div class="lbl">Written Works (${(WEIGHTS.ww * 100).toFixed(0)}%)</div>
              <div class="val">${wwAvg != null ? wwAvg.toFixed(1) + '%' : '—'}</div>
              <div class="sub">${quizPcts.length}/3 quizzes taken</div>
            </div>
            <div class="gs-summary-card ${ptAvg != null && ptAvg >= 75 ? 'green' : ptAvg != null ? 'amber' : ''}">
              <div class="lbl">Performance Tasks (${(WEIGHTS.pt * 100).toFixed(0)}%)</div>
              <div class="val">${ptAvg != null ? ptAvg.toFixed(1) + '%' : '—'}</div>
              <div class="sub">${ptPcts.length}/3 PTs completed</div>
            </div>
            <div class="gs-summary-card ${exAvg != null && exAvg >= 75 ? 'green' : exAvg != null ? 'amber' : ''}">
              <div class="lbl">Term Exam (${(WEIGHTS.ex * 100).toFixed(0)}%)</div>
              <div class="val">${exAvg != null ? exAvg.toFixed(1) + '%' : '—'}</div>
              <div class="sub">30% ST1 + 30% ST2 + 40% TE</div>
            </div>
            <div class="gs-summary-card ${final.passing ? 'green' : final.transmuted > 0 ? 'red' : ''}">
              <div class="lbl">Final Grade (${termLabel})</div>
              <div class="val" style="color:${final.passing ? '#2e7d32' : '#c62828'};">
                ${final.transmuted || '—'}
              </div>
              <div class="sub">Raw: ${final.raw != null ? final.raw.toFixed(1) : '—'}</div>
            </div>
          </div>

          <!-- WW Group -->
          <div class="gs-group ww">
            <div class="gs-group-header">
              <div class="gs-group-title">📝 Written Works — ${(WEIGHTS.ww * 100).toFixed(0)}%</div>
              <span class="gs-weight-badge">${wwAvg != null ? wwAvg.toFixed(1) + '%' : 'No data'}</span>
            </div>
            <div class="gs-row header">
              <div>Assessment</div>
              <div style="text-align:right;">Score</div>
              <div style="text-align:right;">Total</div>
              <div style="text-align:right;">%</div>
              <div style="text-align:right;">Weighted</div>
            </div>
            ${renderRow('Quiz 1', q1, WEIGHTS.ww / 3)}
            ${renderRow('Quiz 2', q2, WEIGHTS.ww / 3)}
            ${renderRow('Quiz 3', q3, WEIGHTS.ww / 3)}
          </div>

          <!-- PT Group -->
          <div class="gs-group pt">
            <div class="gs-group-header">
              <div class="gs-group-title">🎯 Performance Tasks — ${(WEIGHTS.pt * 100).toFixed(0)}%</div>
              <span class="gs-weight-badge">${ptAvg != null ? ptAvg.toFixed(1) + '%' : 'No data'}</span>
            </div>
            <div class="gs-row header">
              <div>Assessment</div>
              <div style="text-align:right;">Score</div>
              <div style="text-align:right;">Total</div>
              <div style="text-align:right;">%</div>
              <div style="text-align:right;">Weighted</div>
            </div>
            ${renderRow('PT1 — Physics in My Daily Life', pt1, WEIGHTS.pt / 3, 'pt')}
            ${renderRow('PT2 — Model Filipino House', pt2, WEIGHTS.pt / 3, 'pt')}
            ${renderRow('PT3 — Chemistry in My Home', pt3, WEIGHTS.pt / 3, 'pt')}
          </div>

          <!-- EX Group -->
          <div class="gs-group ex">
            <div class="gs-group-header">
              <div class="gs-group-title">📚 Term Exam — ${(WEIGHTS.ex * 100).toFixed(0)}%</div>
              <span class="gs-weight-badge">${exAvg != null ? exAvg.toFixed(1) + '%' : 'No data'}</span>
            </div>
            <div class="gs-row header">
              <div>Assessment</div>
              <div style="text-align:right;">Score</div>
              <div style="text-align:right;">Total</div>
              <div style="text-align:right;">%</div>
              <div style="text-align:right;">Weighted</div>
            </div>
            ${renderRow('Summative Test 1 (30% of EX)', st1, EX_INTERNAL.st1)}
            ${renderRow('Summative Test 2 (30% of EX)', st2, EX_INTERNAL.st2)}
            ${renderRow('Term Exam (40% of EX)', te, EX_INTERNAL.te)}
          </div>

          <!-- Final calculation -->
          <div class="gs-group" style="border-top-color:#004d40;background:linear-gradient(135deg,#f0fdf9,#e0f2f1);">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
              <div>
                <div style="font-size:0.75rem;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:0.5px;">
                  Final Computation
                </div>
                <div style="font-size:0.88rem;color:#37474f;margin-top:6px;line-height:1.6;">
                  (WW ${wwAvg != null ? wwAvg.toFixed(1) : '0'} × ${WEIGHTS.ww}) +
                  (PT ${ptAvg != null ? ptAvg.toFixed(1) : '0'} × ${WEIGHTS.pt}) +
                  (EX ${exAvg != null ? exAvg.toFixed(1) : '0'} × ${WEIGHTS.ex}) =
                  <strong>${final.raw != null ? final.raw.toFixed(2) : '—'}</strong>
                </div>
                <div style="font-size:0.82rem;color:#5f6368;margin-top:4px;">
                  Transmuted grade: <strong style="color:${final.passing ? '#2e7d32' : '#c62828'};font-size:1rem;">${final.transmuted || '—'}</strong>
                  · ${final.passing ? '✅ PASSED' : '❌ FAILED'}
                </div>
              </div>
              <div style="text-align:center;padding:12px 24px;background:#fff;border-radius:12px;border:2px solid ${final.passing ? '#2e7d32' : '#c62828'};">
                <div style="font-size:2.5rem;font-weight:900;color:${final.passing ? '#2e7d32' : '#c62828'};line-height:1;">
                  ${final.transmuted || '—'}
                </div>
                <div style="font-size:0.7rem;font-weight:700;color:#5f6368;text-transform:uppercase;letter-spacing:0.5px;margin-top:4px;">
                  Final Grade
                </div>
              </div>
            </div>
          </div>
        `;
      }

      function renderRow(label, record, weight, type) {
        if (!record) {
          return `
            <div class="gs-row">
              <div class="label">${label}</div>
              <div class="val missing">—</div>
              <div class="val missing">—</div>
              <div class="val missing">—</div>
              <div class="val missing">—</div>
            </div>
          `;
        }

        const score = record.score ?? (type === 'pt' && record.submittedAt ? '✓' : '—');
        const total = record.total ?? (type === 'pt' ? 100 : '—');
        const pct = record.percent != null
          ? record.percent
          : (record.score != null && record.total ? (record.score / record.total) * 100 : null);
        const weighted = pct != null ? (pct * weight) : null;

        return `
          <div class="gs-row">
            <div class="label">${label}</div>
            <div class="val">${score}</div>
            <div class="val">${total}</div>
            <div class="val pct ${pctClass(pct)}">${pct != null ? pct.toFixed(1) + '%' : '—'}</div>
            <div class="val">${weighted != null ? weighted.toFixed(2) : '—'}</div>
          </div>
        `;
      }

      /* ============================================================
         EXPORT
         ============================================================ */
      function exportSheet() {
        const lrn = document.getElementById('filter-student').value;
        if (!lrn) {
          APP.toast('Select a student first', 'warning');
          return;
        }

        const term = document.getElementById('filter-term').value;
        const student = Store.getUser(lrn);
        const scores = Store.getScores(lrn);
        const t = scores[term] || {};

        const rows = [
          ['Student', APP.formatFullName(student.lastName, student.firstName, student.middleName)],
          ['LRN', student.lrn],
          ['Section', student.section],
          ['Term', term],
          [],
          ['Assessment', 'Score', 'Total', '%']
        ];

        const addRow = (label, rec, total) => {
          if (!rec) {
            rows.push([label, '', '', '']);
            return;
          }
          const pct = rec.percent ?? (rec.score != null && rec.total ? (rec.score / rec.total) * 100 : null);
          rows.push([
            label,
            rec.score ?? (rec.submittedAt ? 'Submitted' : ''),
            rec.total ?? total ?? '',
            pct != null ? pct.toFixed(1) : ''
          ]);
        };

        addRow('Quiz 1', t.quizzes?.quiz1, 20);
        addRow('Quiz 2', t.quizzes?.quiz2, 20);
        addRow('Quiz 3', t.quizzes?.quiz3, 20);
        addRow('PT1', t.pt?.pt1, 100);
        addRow('PT2', t.pt?.pt2, 100);
        addRow('PT3', t.pt?.pt3, 100);
        addRow('ST1', t.st?.st1, 30);
        addRow('ST2', t.st?.st2, 30);
        addRow('Term Exam', t.te, 60);

        UI.exportCSV(
          `GSA_GradingSheet_${student.lastName}_${term}.csv`,
          rows[0],
          rows.slice(1)
        );
        APP.toast('Grading sheet exported', 'success');
      }

      /* ============================================================
         EVENT LISTENERS
         ============================================================ */
      document.getElementById('filter-term').addEventListener('change', render);
      document.getElementById('filter-student').addEventListener('change', render);
      document.getElementById('filter-section').addEventListener('change', () => {
        refreshStudentDropdown();
        render();
      });
      document.getElementById('btn-refresh').addEventListener('click', () => {
        refreshStudentDropdown();
        render();
        APP.toast('Refreshed', 'success', 1500);
      });
      document.getElementById('btn-export').addEventListener('click', exportSheet);
      document.getElementById('btn-logout').addEventListener('click', () => TeacherAuth.logout());

      /* ============================================================
         INIT
         ============================================================ */
      document.addEventListener('DOMContentLoaded', () => {
        refreshStudentDropdown();
      });

    })();
  </script>
</body>
</html>

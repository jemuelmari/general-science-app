<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Performance Task — General Science</title>
  <link rel="stylesheet" href="../../../assets/css/main.css" />
  <link rel="stylesheet" href="../../../assets/css/student.css" />
  <style>
    .pt-hero {
      position: relative;
      background: linear-gradient(135deg, #004d40 0%, #00695c 60%, #26a69a 100%);
      color: #fff;
      border-radius: 18px;
      padding: 28px 24px;
      margin-bottom: 24px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 77, 64, 0.25);
    }
    .pt-hero::before {
      content: '';
      position: absolute;
      top: -60px; right: -60px;
      width: 200px; height: 200px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
    }
    .pt-hero-content { position: relative; z-index: 1; }
    .pt-hero-label {
      font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 1px; opacity: 0.85; margin-bottom: 4px;
    }
    .pt-hero h2 { color: #fff; font-size: 1.6rem; margin: 0 0 8px; font-weight: 700; }
    .pt-hero p { opacity: 0.92; margin: 0; font-size: 0.9rem; }

    .pt-section {
      background: #fff; border-radius: 14px; padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05); margin-bottom: 20px;
    }
    .pt-section h3 {
      font-size: 1rem; color: #004d40; margin: 0 0 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .pt-section h3::before {
      content: ''; width: 4px; height: 18px;
      background: linear-gradient(180deg, #004d40, #26a69a);
      border-radius: 2px;
    }

    .pt-textarea {
      width: 100%; min-height: 140px; padding: 12px 14px;
      font-family: inherit; font-size: 0.95rem;
      border: 1.5px solid #cfd8dc; border-radius: 10px;
      resize: vertical; line-height: 1.5; color: #1a1a1a;
      transition: all 0.15s ease;
    }
    .pt-textarea:focus {
      outline: none; border-color: #004d40;
      box-shadow: 0 0 0 4px rgba(0, 77, 64, 0.1);
    }

    .pt-file-input-wrap {
      display: block; padding: 20px;
      border: 2px dashed #cfd8dc; border-radius: 10px;
      text-align: center; cursor: pointer;
      transition: all 0.15s ease; background: #fafafa;
    }
    .pt-file-input-wrap:hover {
      border-color: #004d40; background: #f0fdf9;
    }
    .pt-file-input-wrap.has-file {
      border-color: #2e7d32; background: #f1f8f4; border-style: solid;
    }
    .pt-file-input-wrap input[type="file"] { display: none; }

    .pt-option-list { display: flex; flex-direction: column; gap: 10px; }
    .pt-option {
      display: flex; align-items: center; gap: 12px;
      padding: 14px 16px;
      border: 2px solid #dadce0; border-radius: 10px;
      cursor: pointer; transition: all 0.15s ease; background: #fff;
    }
    .pt-option:hover { border-color: #004d40; background: #f0fdf9; }
    .pt-option.selected {
      border-color: #004d40; background: #e0f2f1; font-weight: 600;
    }
    .pt-option input[type="radio"] {
      accent-color: #004d40; width: 18px; height: 18px; cursor: pointer;
    }

    .pt-checklist { list-style: none; padding: 0; margin: 0; font-size: 0.9rem; }
    .pt-checklist li {
      padding: 8px 0 8px 28px; border-bottom: 1px solid #f5f5f5;
      position: relative; color: #37474f; line-height: 1.5;
    }
    .pt-checklist li:last-child { border-bottom: none; }
    .pt-checklist li::before {
      content: '☐'; position: absolute; left: 0; top: 8px;
      color: #004d40; font-size: 1.1rem; font-weight: 700;
    }

    .pt-submit-btn {
      width: 100%; padding: 16px 20px;
      background: linear-gradient(135deg, #004d40, #00695c);
      color: #fff; border: none; border-radius: 10px;
      font-family: inherit; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(0, 77, 64, 0.25);
    }
    .pt-submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 77, 64, 0.35);
    }
    .pt-submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .pt-status-banner {
      padding: 14px 18px; border-radius: 10px; margin-bottom: 20px;
      font-size: 0.9rem; display: flex; align-items: center; gap: 10px;
    }
    .pt-status-banner.submitted {
      background: #e8f5e9; border-left: 4px solid #2e7d32; color: #1b5e20;
    }
    .pt-status-banner.pending {
      background: #fff3e0; border-left: 4px solid #ed6c02; color: #e65100;
    }

    .pt-rubric {
      background: #f5f7fa; border-radius: 10px; padding: 16px; font-size: 0.85rem;
    }
    .pt-rubric-row {
      display: flex; justify-content: space-between;
      padding: 8px 0; border-bottom: 1px solid #e0e0e0; color: #37474f;
    }
    .pt-rubric-row:last-child { border-bottom: none; }
    .pt-rubric-row strong { color: #004d40; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="container flex-between">
      <div>
        <h1 id="header-title">📋 Performance Task</h1>
        <span class="version">v1.0.0</span>
      </div>
      <a href="../index.html" class="btn btn-outline" style="color:#fff;border-color:#fff;font-size:0.85rem;">← Term 3</a>
    </div>
  </header>

  <main class="container" style="max-width:720px;padding-top:24px;padding-bottom:64px;">
    <div id="pt-root">
      <div style="text-align:center;padding:40px;">
        <div style="font-size:2rem;">⏳</div>
        <p class="text-muted">Loading performance task…</p>
      </div>
    </div>
  </main>

  <footer class="app-footer">
    <p>General Science Online Modular Application · <span class="version">v1.0.0</span></p>
  </footer>

  <script src="../../../config.js"></script>
  <script src="../../../assets/js/app.js"></script>
  <script src="../../../assets/js/store.js"></script>
  <script>
    (function() {
      'use strict';

      const filename = window.location.pathname.split('/').pop().replace('.html', '');
      const TERM = 'term3';

      const PT_META = {
        pt1: { id: 'pt1', file: 'pt1.json' },
        pt2: { id: 'pt2', file: 'pt2.json' },
        pt3: { id: 'pt3', file: 'pt3.json' }
      };

      const meta = PT_META[filename];
      if (!meta) {
        document.getElementById('pt-root').innerHTML = `
          <div class="card" style="text-align:center;padding:40px;">
            <div style="font-size:2rem;">⚠️</div>
            <h2 style="color:#c62828;">Performance Task not found</h2>
            <p class="text-muted">The file <code>${filename}.html</code> is not recognized.</p>
            <a href="../index.html" class="btn btn-primary mt-md">← Back to Term 3</a>
          </div>
        `;
        return;
      }

      const user = Store.getCurrentUser();
      if (!user) { window.location.replace('../../login.html'); return; }

      fetch(meta.file)
        .then((r) => {
          if (!r.ok) throw new Error(`Failed to load ${meta.file}`);
          return r.json();
        })
        .then((data) => {
          document.title = `${data.title} — General Science`;
          document.getElementById('header-title').textContent = `📋 ${data.shortTitle || data.title}`;
          renderPT(data);
        })
        .catch((err) => {
          console.error('[PT] Load error:', err);
          document.getElementById('pt-root').innerHTML = `
            <div class="card" style="text-align:center;padding:40px;">
              <div style="font-size:2rem;">⚠️</div>
              <h2 style="color:#c62828;">Failed to load</h2>
              <p class="text-muted text-small">${err.message}</p>
              <button onclick="location.reload()" class="btn btn-primary mt-md">🔄 Retry</button>
            </div>
          `;
        });

      function renderPT(pt) {
        const scores = Store.getScores(user.lrn);
        const existing = scores[TERM]?.pt?.[meta.id] || null;
        const root = document.getElementById('pt-root');

        let statusHTML = '';
        if (existing && existing.submittedAt) {
          statusHTML = `
            <div class="pt-status-banner submitted">
              <span style="font-size:1.3rem;">✅</span>
              <div>
                <strong>Submitted</strong> on ${APP.formatDate(existing.submittedAt)}
                ${existing.score != null ? ` · Score: <strong>${existing.score}/100</strong>` : ' · Awaiting teacher grading'}
              </div>
            </div>
          `;
        } else {
          statusHTML = `
            <div class="pt-status-banner pending">
              <span style="font-size:1.3rem;">⏳</span>
              <div>Not yet submitted — complete the form below and click Submit.</div>
            </div>
          `;
        }

        let optionsHTML = '';
        if (pt.options && pt.options.length) {
          optionsHTML = `
            <div class="pt-section">
              <h3>Choose your option</h3>
              <div class="pt-option-list" id="pt-option-list">
                ${pt.options.map((opt) => `
                  <label class="pt-option" data-value="${opt}">
                    <input type="radio" name="pt-option" value="${opt}" ${existing?.option === opt ? 'checked' : ''} />
                    <span>${opt}</span>
                  </label>
                `).join('')}
              </div>
            </div>
          `;
        }

        root.innerHTML = `
          <div class="pt-hero">
            <div class="pt-hero-content">
              <div class="pt-hero-label">Term 3 · ${pt.coverage || ''}</div>
              <h2>📋 ${pt.title}</h2>
              <p>${pt.summary || ''}</p>
            </div>
          </div>

          ${statusHTML}

          <div class="pt-section">
            <h3>📝 Instructions</h3>
            <div style="font-size:0.92rem;line-height:1.7;color:#37474f;">
              ${pt.instructions || '<p>Follow the task details below.</p>'}
            </div>
          </div>

          <div class="pt-section">
            <h3>🎯 Requirements Checklist</h3>
            <ul class="pt-checklist">
              ${(pt.requirements || []).map(r => `<li>${r}</li>`).join('')}
            </ul>
          </div>

          ${optionsHTML}

          <div class="pt-section">
            <h3>📎 Submit your work (optional file)</h3>
            <label class="pt-file-input-wrap ${existing?.fileName ? 'has-file' : ''}" id="pt-file-wrap">
              <input type="file" id="pt-file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.mp4,.mp3" />
              <div id="pt-file-label">
                ${existing?.fileName
                  ? `📎 ${existing.fileName} (previously submitted)`
                  : '📎 Click to upload your file (PDF, DOCX, JPG, PNG, MP4, MP3)'}
              </div>
              <div style="font-size:0.78rem;color:#90a4ae;margin-top:6px;">
                Max 25 MB · You may also paste a link in the reflection below
              </div>
            </label>
          </div>

          <div class="pt-section">
            <h3>✍️ Reflection (required)</h3>
            <p style="font-size:0.85rem;color:#5f6368;margin:0 0 10px;">
              In 3–5 sentences, describe what you did, what you learned, and how you could improve next time.
            </p>
            <textarea id="pt-reflection" class="pt-textarea" placeholder="Type your reflection here…">${existing?.reflection || ''}</textarea>
          </div>

          <div class="pt-section">
            <h3>📊 Rubric (100 points)</h3>
            <div class="pt-rubric">
              ${(pt.rubric || []).map(r => `
                <div class="pt-rubric-row">
                  <span>${r.criterion}</span>
                  <strong>${r.points} pts</strong>
                </div>
              `).join('')}
            </div>
          </div>

          <button class="pt-submit-btn" id="pt-submit" ${existing?.submittedAt ? 'disabled' : ''}>
            ${existing?.submittedAt ? '✓ Already Submitted' : '📤 Submit Performance Task'}
          </button>

          <div id="pt-error" class="alert alert-danger hidden" style="margin-top:16px;"></div>
          <div id="pt-success" class="alert alert-success hidden" style="margin-top:16px;"></div>
        `;

        wireOptions(existing);
        wireFileInput();
        wireSubmit(pt, existing);
      }

      function wireOptions(existing) {
        const list = document.getElementById('pt-option-list');
        if (!list) return;
        const opts = list.querySelectorAll('.pt-option');
        opts.forEach((o) => {
          o.addEventListener('click', () => {
            opts.forEach(x => x.classList.remove('selected'));
            o.classList.add('selected');
          });
          if (o.querySelector('input').checked) o.classList.add('selected');
        });
      }

      let selectedFile = null;

      function wireFileInput() {
        const input = document.getElementById('pt-file');
        const label = document.getElementById('pt-file-label');
        const wrap = document.getElementById('pt-file-wrap');
        if (!input) return;

        input.addEventListener('change', () => {
          if (input.files && input.files[0]) {
            selectedFile = input.files[0];
            label.textContent = `📎 ${selectedFile.name} (${(selectedFile.size / 1024).toFixed(0)} KB)`;
            wrap.classList.add('has-file');
          }
        });
      }

      function wireSubmit(pt, existing) {
        const btn = document.getElementById('pt-submit');
        if (!btn || existing?.submittedAt) return;

        btn.addEventListener('click', () => {
          const errEl = document.getElementById('pt-error');
          const okEl = document.getElementById('pt-success');
          errEl.classList.add('hidden');
          okEl.classList.add('hidden');

          const reflection = document.getElementById('pt-reflection')?.value.trim() || '';
          const option = document.querySelector('input[name="pt-option"]:checked')?.value || null;

          if (pt.options && pt.options.length && !option) {
            errEl.textContent = 'Please select an option before submitting.';
            errEl.classList.remove('hidden');
            return;
          }

          if (reflection.length < 50) {
            errEl.textContent = 'Reflection must be at least 50 characters.';
            errEl.classList.remove('hidden');
            return;
          }

          if (!selectedFile && !existing?.fileName) {
            const proceed = confirm('You have not attached a file. Submit anyway?');
            if (!proceed) return;
          }

          const payload = {
            option: option,
            reflection: reflection,
            fileName: selectedFile ? selectedFile.name : (existing?.fileName || null),
            fileSize: selectedFile ? selectedFile.size : (existing?.fileSize || null),
            submittedAt: new Date().toISOString(),
            score: null
          };

          Store.saveScore(user.lrn, TERM, 'pt', meta.id, payload);

          okEl.textContent = '✅ Performance Task submitted! Your teacher will grade it soon.';
          okEl.classList.remove('hidden');
          btn.disabled = true;
          btn.textContent = '✓ Already Submitted';

          APP.toast('Performance Task submitted!', 'success', 3500);
          setTimeout(() => location.reload(), 2000);
        });
      }
    })();
  </script>
</body>
</html>

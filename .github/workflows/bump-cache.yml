name: Bump cache-bust versions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/js/quiz-engine.js'
      - 'assets/js/sync.js'
      - 'assets/js/sync-auto.js'
      - 'config.js'
      - 'assets/js/security.js'
      - 'assets/js/store.js'
      - 'assets/js/app.js'
      - '.github/workflows/bump-cache.yml'

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute new version string
        id: ver
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "VERSION=1.3.0-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "New version: 1.3.0-${SHORT_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump existing ?v= strings + inject sync scripts
        env:
          NEW_VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          python3 << 'PYEOF'
          import os
          import re

          NEW_VERSION = os.environ['NEW_VERSION']
          print(f'New version: {NEW_VERSION}')

          # Step 1 — Bump existing ?v= strings in all HTML files
          bumped = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  path = os.path.join(root, fname)
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  new_content = re.sub(r'\?v=[a-zA-Z0-9._-]+', f'?v={NEW_VERSION}', content)
                  if new_content != content:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      bumped += 1
                      print(f'  ✅ Bumped: {path}')
          print(f'')
          print(f'📊 Bumped: {bumped} HTML files')

          # Step 2 — Inject sync.js + sync-auto.js into quiz pages
          injected = 0
          skipped = 0
          for root, dirs, files in os.walk('./student'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  path = os.path.join(root, fname)
                  # Only inject into assessment pages
                  if '/assessments/' not in path.replace('\\', '/'):
                      continue
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  if 'quiz-engine.js' not in content:
                      continue
                  if 'assets/js/sync.js' in content:
                      skipped += 1
                      print(f'  ⏭️  Already has sync.js: {path}')
                      continue

                  # Determine relative path prefix
                  # student/term1/assessments/quiz1.html → ../../../
                  depth = path.count(os.sep) - path.count('./')
                  rel = '../' * (depth - 1) if depth > 1 else '../'

                  # Insert sync.js and sync-auto.js before quiz-engine.js line
                  lines = content.split('\n')
                  new_lines = []
                  done = False
                  for line in lines:
                      if 'quiz-engine.js' in line and not done:
                          indent = line[:len(line) - len(line.lstrip())]
                          new_lines.append(f'{indent}<script src="{rel}assets/js/sync.js?v=2.0.5"></script>')
                          new_lines.append(f'{indent}<script src="{rel}assets/js/sync-auto.js?v=1.1.0"></script>')
                          done = True
                      new_lines.append(line)

                  with open(path, 'w', encoding='utf-8') as f:
                      f.write('\n'.join(new_lines))
                  injected += 1
                  print(f'  🔧 Injected: {path}')
          print(f'')
          print(f'📊 Injected: {injected} quiz files')
          print(f'📊 Already had sync.js: {skipped} quiz files')

          # Step 3 — Add ?v= to scripts that are missing it
          added = 0
          patterns = [
              (r'(src="([^"]*\/)?config\.js)("|)', r'\1?v=' + NEW_VERSION + r'\3'),
              (r'(src="([^"]*\/)?app\.js)("|)', r'\1?v=' + NEW_VERSION + r'\3'),
              (r'(src="([^"]*\/)?store\.js)("|)', r'\1?v=' + NEW_VERSION + r'\3'),
              (r'(src="([^"]*\/)?security\.js)("|)', r'\1?v=' + NEW_VERSION + r'\3'),
              (r'(src="([^"]*\/)?transmutation\.js)("|)', r'\1?v=' + NEW_VERSION + r'\3'),
          ]

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  path = os.path.join(root, fname)
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  orig = content
                  for pattern, replacement in patterns:
                      content = re.sub(pattern, replacement, content)
                  if content != orig:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      added += 1
                      print(f'  ✅ Added ?v=: {path}')
          print(f'')
          print(f'📊 Files with newly-added ?v=: {added}')
          PYEOF

      - name: Show git diff summary
        run: |
          echo "=== Git status ==="
          git status --short
          echo ""
          echo "=== Files changed ==="
          git diff --stat

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-bump cache-bust + inject sync scripts"
            git push
          fi

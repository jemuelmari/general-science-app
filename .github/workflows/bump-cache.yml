name: Bump cache-bust versions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/js/quiz-engine.js'
      - 'assets/js/sync.js'
      - 'assets/js/sync-auto.js'
      - 'config.js'
      - '.github/workflows/bump-cache.yml'

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute new version string
        id: ver
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "VERSION=1.3.0-${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "New version: 1.3.0-${SHORT_SHA}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bump + fix sync script injection
        env:
          NEW_VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          python3 << 'PYEOF'
          import os
          import re

          NEW_VERSION = os.environ['NEW_VERSION']
          print(f'New version: {NEW_VERSION}')

          # Step 1 — Bump existing ?v= strings
          bumped = 0
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  path = os.path.join(root, fname)
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  new_content = re.sub(r'\?v=[a-zA-Z0-9._-]+', f'?v={NEW_VERSION}', content)
                  if new_content != content:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      bumped += 1
          print(f'📊 Bumped: {bumped} HTML files')
          print()

          # Step 2 — Fix sync script injection (remove wrong ones, add correct ones)
          fixed = 0
          skipped = 0
          for root, dirs, files in os.walk('./student'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  path = os.path.join(root, fname)
                  normalized = path.replace('\\', '/')
                  if '/assessments/' not in normalized:
                      continue

                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()

                  if 'quiz-engine.js' not in content:
                      continue

                  # Compute correct relative path to repo root
                  # student/term2/assessments/quiz1.html → ../../../
                  if normalized.startswith('./'):
                      normalized_dir = normalized[2:]
                  else:
                      normalized_dir = normalized
                  dir_parts = normalized_dir.split('/')[:-1]  # exclude filename
                  levels_up = len(dir_parts)
                  rel = '../' * levels_up

                  # Remove ANY existing sync.js / sync-auto.js lines (correct or wrong)
                  content = re.sub(r'[ \t]*<script src="[^"]*sync\.js[^"]*"></script>\s*\n', '', content)
                  content = re.sub(r'[ \t]*<script src="[^"]*sync-auto\.js[^"]*"></script>\s*\n', '', content)

                  # Find the quiz-engine.js line, insert sync lines before it
                  lines = content.split('\n')
                  new_lines = []
                  inserted = False
                  for line in lines:
                      if 'quiz-engine.js' in line and not inserted:
                          indent = line[:len(line) - len(line.lstrip())]
                          new_lines.append(f'{indent}<script src="{rel}assets/js/sync.js?v=2.0.5"></script>')
                          new_lines.append(f'{indent}<script src="{rel}assets/js/sync-auto.js?v=1.1.0"></script>')
                          inserted = True
                      new_lines.append(line)

                  new_content = '\n'.join(new_lines)
                  if new_content != content:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(new_content)
                      fixed += 1
                      print(f'  🔧 Fixed ({rel}): {path}')
                  else:
                      skipped += 1
          print()
          print(f'📊 Fixed: {fixed} quiz files')
          print(f'📊 Skipped: {skipped} quiz files')

          # Step 3 — Add ?v= to scripts missing it
          added = 0
          scripts = ['config.js', 'app.js', 'store.js', 'security.js', 'transmutation.js']
          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', 'node_modules')]
              for fname in files:
                  if not fname.endswith('.html'):
                      continue
                  path = os.path.join(root, fname)
                  with open(path, 'r', encoding='utf-8') as f:
                      content = f.read()
                  orig = content
                  for s in scripts:
                      # Add ?v= if not present before the closing quote
                      pattern = rf'(src="[^"]*/\{s})(")'
                      replacement = rf'\1?v={NEW_VERSION}\2'
                      content = re.sub(pattern, replacement, content)
                  if content != orig:
                      with open(path, 'w', encoding='utf-8') as f:
                          f.write(content)
                      added += 1
          print(f'📊 Files with newly-added ?v=: {added}')
          PYEOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: fix sync script injection paths + cache-bust"
            git push
          fi

name: Propagate Day Template

on:
  workflow_dispatch:

jobs:
  propagate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Propagate day.html template to all terms/weeks
        run: |
          echo "Propagating day.html template..."
          
          TEMPLATE_FILE=".github/templates/day.html"
          if [ ! -f "$TEMPLATE_FILE" ]; then
            echo "❌ Template file not found: $TEMPLATE_FILE"
            exit 1
          fi
          
          UPDATED=0
          for term_dir in student/term*/; do
            for week_dir in "${term_dir}week"*/; do
              DAY_FILE="${week_dir}day.html"
              if [ -f "$DAY_FILE" ]; then
                cp "$TEMPLATE_FILE" "$DAY_FILE"
                echo "✅ Updated: $DAY_FILE"
                UPDATED=$((UPDATED + 1))
              fi
            done
          done
          
          echo "=============================="
          echo "Updated: $UPDATED day.html file(s)"
          echo "=============================="

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          
          git add student/
          git commit -m "refactor: propagate day.html template to all terms/weeks (shared day-loader.js)"
          git push

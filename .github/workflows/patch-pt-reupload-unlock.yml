name: Fix PT Unlock Crash

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to apply the crash fix to all 9 ptN.html files'
        required: true
        default: 'no'

jobs:
  patch-pt-unlock:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply crash fix
        run: |
          set -e
          
          FILES=(
            "student/term1/assessments/pt1.html"
            "student/term1/assessments/pt2.html"
            "student/term1/assessments/pt3.html"
            "student/term2/assessments/pt1.html"
            "student/term2/assessments/pt2.html"
            "student/term2/assessments/pt3.html"
            "student/term3/assessments/pt1.html"
            "student/term3/assessments/pt2.html"
            "student/term3/assessments/pt3.html"
          )
          
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then continue; fi
            
            # Replace the crash-prone unlock check with a safe one
            perl -0777 -i -pe "s/\/\/ FIX: Safe unlock check\s*var currentUser = Store\.getCurrentUser\(\);\s*var isUnlocked = false;\s*if \(currentUser && currentUser\.lrn\) \{\s*var unlockKey = 'gsa_v1_pt_unlocked_' \+ currentUser\.lrn \+ '_' \+ TERM \+ '_' \+ meta\.id;\s*isUnlocked = localStorage\.getItem\(unlockKey\) === 'true';\s*\}\s*const isGraded = !!currentGrade && !isUnlocked;/\/\/ FIX: Safe unlock check with fallback\n        var isUnlocked = false;\n        try {\n          var currentUser = Store.getCurrentUser();\n          if (currentUser \&\& currentUser.lrn) {\n            var unlockKey = 'gsa_v1_pt_unlocked_' + currentUser.lrn + '_' + TERM + '_' + meta.id;\n            isUnlocked = localStorage.getItem(unlockKey) === 'true';\n          }\n        } catch(e) {}\n        const isGraded = !!currentGrade \&\& !isUnlocked;/gs" "$f"
            
            echo "✅ Patched: $f"
          done

      - name: Show diff
        run: git diff --stat

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add student/term1/assessments/pt*.html
          git add student/term2/assessments/pt*.html
          git add student/term3/assessments/pt*.html
          
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "fix: add safe fallback for user.lrn in PT unlock check [skip ci]"
            git push
          fi

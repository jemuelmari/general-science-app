name: Final Fix for PT Crash & Cache

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to fix crash and bump version'
        required: true
        default: 'no'

jobs:
  patch-pt-unlock:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply final fix
        run: |
          set -e
          
          FILES=(
            "student/term1/assessments/pt1.html"
            "student/term1/assessments/pt2.html"
            "student/term1/assessments/pt3.html"
            "student/term2/assessments/pt1.html"
            "student/term2/assessments/pt2.html"
            "student/term2/assessments/pt3.html"
            "student/term3/assessments/pt1.html"
            "student/term3/assessments/pt2.html"
            "student/term3/assessments/pt3.html"
          )
          
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then continue; fi
            
            # 1. I-update ang version para ma-force ang cache refresh
            sed -i 's/<span class="version">v1.0.7<\/span>/<span class="version">v1.0.8<\/span>/g' "$f"
            
            # 2. Ayusin ang code para hindi mag-crash pag wala pang user
            perl -0777 -i -pe "s/\/\/ FIX: Safe unlock check with fallback\s*var isUnlocked = false;\s*try \{\s*var currentUser = Store\.getCurrentUser\(\);\s*if \(currentUser && currentUser\.lrn\) \{\s*var unlockKey = 'gsa_v1_pt_unlocked_' \+ currentUser\.lrn \+ '_' \+ TERM \+ '_' \+ meta\.id;\s*isUnlocked = localStorage\.getItem\(unlockKey\) === 'true';\s*\}\s*\} catch\(e\) \{\}\s*const isGraded = !!currentGrade && !isUnlocked;/\/\/ FIX: Safe unlock check\n        var isUnlocked = false;\n        if (typeof user !== 'undefined' \&\& user \&\& user.lrn) {\n          var unlockKey = 'gsa_v1_pt_unlocked_' + user.lrn + '_' + TERM + '_' + meta.id;\n          isUnlocked = localStorage.getItem(unlockKey) === 'true';\n        }\n        const isGraded = !!currentGrade \&\& !isUnlocked;/gs" "$f"
            
            echo "✅ Patched: $f"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add student/term1/assessments/pt*.html
          git add student/term2/assessments/pt*.html
          git add student/term3/assessments/pt*.html
          
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "fix: final safe unlock check + version bump to 1.0.8 [skip ci]"
            git push
          fi

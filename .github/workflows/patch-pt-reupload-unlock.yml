name: Final Fix for PT Crash & Cache

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to fix crash and bump version'
        required: true
        default: 'no'

jobs:
  patch-pt-unlock:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply final fix
        run: |
          set -e
          
          FILES=(
            "student/term1/assessments/pt1.html"
            "student/term1/assessments/pt2.html"
            "student/term1/assessments/pt3.html"
            "student/term2/assessments/pt1.html"
            "student/term2/assessments/pt2.html"
            "student/term2/assessments/pt3.html"
            "student/term3/assessments/pt1.html"
            "student/term3/assessments/pt2.html"
            "student/term3/assessments/pt3.html"
          )
          
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then continue; fi
            
            # 1. I-update ang version
            sed -i 's/v1.0.7/v1.0.8/g' "$f"
            sed -i 's/v1.0.8/v1.0.9/g' "$f"
            
            # 2. Ayusin ang renderPT crash (yung duplicate var user)
            # Hinahanap nito yung exact code na naka-inject nung unang patch
            perl -0777 -i -pe "s/\/\/ FIX: Check if unlocked via code\s*var user = Store\.getCurrentUser\(\);\s*var unlockKey = 'gsa_v1_pt_unlocked_' \+ user\.lrn \+ '_' \+ TERM \+ '_' \+ meta\.id;\s*var isUnlocked = localStorage\.getItem\(unlockKey\) === 'true';\s*const isGraded = !!currentGrade && !isUnlocked;/\/\/ FIX: Safe unlock check\n        var isUnlocked = false;\n        if (typeof user !== 'undefined' \&\& user \&\& user.lrn) {\n          var unlockKey = 'gsa_v1_pt_unlocked_' + user.lrn + '_' + TERM + '_' + meta.id;\n          isUnlocked = localStorage.getItem(unlockKey) === 'true';\n        }\n        const isGraded = !!currentGrade \&\& !isUnlocked;/gs" "$f"
            
            # 3. Ayusin ang wireReuploadFlow crash
            perl -0777 -i -pe "s/var user = Store\.getCurrentUser\(\);\s*var unlockKey = 'gsa_v1_pt_unlocked_' \+ user\.lrn \+ '_' \+ TERM \+ '_' \+ meta\.id;\s*localStorage\.setItem\(unlockKey, 'true'\);/if (typeof user !== 'undefined' \&\& user \&\& user.lrn) {\n                  var unlockKey = 'gsa_v1_pt_unlocked_' + user.lrn + '_' + TERM + '_' + meta.id;\n                  localStorage.setItem(unlockKey, 'true');\n                }/gs" "$f"
            
            echo "✅ Patched: $f"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add student/term1/assessments/pt*.html
          git add student/term2/assessments/pt*.html
          git add student/term3/assessments/pt*.html
          
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "fix: final safe unlock check + version bump [skip ci]"
            git push
          fi

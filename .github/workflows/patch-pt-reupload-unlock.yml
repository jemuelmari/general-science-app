name: Patch PT Re-upload Unlock Logic

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to apply unlock logic to all 9 ptN.html files'
        required: true
        default: 'no'

jobs:
  patch-pt-unlock:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply unlock logic patch
        run: |
          set -e
          
          FILES=(
            "student/term1/assessments/pt1.html"
            "student/term1/assessments/pt2.html"
            "student/term1/assessments/pt3.html"
            "student/term2/assessments/pt1.html"
            "student/term2/assessments/pt2.html"
            "student/term2/assessments/pt3.html"
            "student/term3/assessments/pt1.html"
            "student/term3/assessments/pt2.html"
            "student/term3/assessments/pt3.html"
          )
          
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "⚠️ Missing: $f"
              continue
            fi
            
            # 1. Patch renderPT — add localStorage unlock check
            if ! grep -q "gsa_v1_pt_unlocked_" "$f"; then
              perl -0777 -i -pe "s/const submitted = existing && existing\.submittedAt;\s*\n\s*const isGraded = !!currentGrade;/const submitted = existing \&\& existing.submittedAt;\n        \/\/ FIX: Check if unlocked via code\n        var user = Store.getCurrentUser();\n        var unlockKey = 'gsa_v1_pt_unlocked_' + user.lrn + '_' + TERM + '_' + meta.id;\n        var isUnlocked = localStorage.getItem(unlockKey) === 'true';\n        const isGraded = !!currentGrade \&\& !isUnlocked;/gs" "$f"
              echo "✅ Patched renderPT: $f"
            else
              echo "⏭️ renderPT already patched: $f"
            fi
            
            # 2. Patch wireReuploadFlow — save to localStorage on redeem success
            if ! grep -q "localStorage.setItem(unlockKey, 'true');" "$f"; then
              perl -0777 -i -pe "s/(msg\.textContent = '✅ Code accepted!.*?)(setTimeout\(function\(\) \{ location\.reload\(\); \}, 1500\);)/\1  \/\/ FIX: Save unlock to localStorage\n                  var user = Store.getCurrentUser();\n                  var unlockKey = 'gsa_v1_pt_unlocked_' + user.lrn + '_' + TERM + '_' + meta.id;\n                  localStorage.setItem(unlockKey, 'true');\n                  \2/s" "$f"
              echo "✅ Patched redeem: $f"
            else
              echo "⏭️ redeem already patched: $f"
            fi
          done

      - name: Show diff
        run: |
          git diff --stat

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add student/term1/assessments/pt*.html
          git add student/term2/assessments/pt*.html
          git add student/term3/assessments/pt*.html
          
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "fix: persist PT reupload unlock state in localStorage across all terms [skip ci]"
            git push
            echo "✅ Pushed"
          fi

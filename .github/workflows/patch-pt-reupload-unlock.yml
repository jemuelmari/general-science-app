name: Patch PT Re-upload Unlock Logic v2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "yes" to apply FIXED unlock logic'
        required: true
        default: 'no'

jobs:
  patch-pt-unlock:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Revert previous bad patch + Apply new safe patch
        run: |
          set -e
          
          FILES=(
            "student/term1/assessments/pt1.html"
            "student/term1/assessments/pt2.html"
            "student/term1/assessments/pt3.html"
            "student/term2/assessments/pt1.html"
            "student/term2/assessments/pt2.html"
            "student/term2/assessments/pt3.html"
            "student/term3/assessments/pt1.html"
            "student/term3/assessments/pt2.html"
            "student/term3/assessments/pt3.html"
          )
          
          for f in "${FILES[@]}"; do
            if [ ! -f "$f" ]; then continue; fi
            
            # REVERT: Remove the previous bad patch na may duplicate 'var user'
            perl -0777 -i -pe "s/\/\/ FIX: Check kung naka-unlock na siya via code\s*var user = Store\.getCurrentUser\(\);\s*var unlockKey = 'gsa_v1_pt_unlocked_' \+ user\.lrn \+ '_' \+ TERM \+ '_' \+ meta\.id;\s*var isUnlocked = localStorage\.getItem\(unlockKey\) === 'true';\s*\/\/ Kung naka-unlock na, hindi na siya \"graded\" para payagan mag-upload\s*const isGraded = !!currentGrade && !isUnlocked;//g" "$f"
            
            # APPLY: Safe version with defensive check
            if ! grep -q "gsa_v1_pt_unlocked_" "$f"; then
              perl -0777 -i -pe "s/const submitted = existing && existing\.submittedAt;\s*const isGraded = !!currentGrade;/const submitted = existing \&\& existing.submittedAt;\n        \/\/ FIX: Safe unlock check\n        var currentUser = Store.getCurrentUser();\n        var isUnlocked = false;\n        if (currentUser \&\& currentUser.lrn) {\n          var unlockKey = 'gsa_v1_pt_unlocked_' + currentUser.lrn + '_' + TERM + '_' + meta.id;\n          isUnlocked = localStorage.getItem(unlockKey) === 'true';\n        }\n        const isGraded = !!currentGrade \&\& !isUnlocked;/gs" "$f"
            fi
          done

      - name: Show diff
        run: git diff --stat

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add student/term1/assessments/pt*.html
          git add student/term2/assessments/pt*.html
          git add student/term3/assessments/pt*.html
          
          if git diff --cached --quiet; then
            echo "✅ No changes to commit"
          else
            git commit -m "fix: revert duplicate var user + add defensive null check in PT unlock [skip ci]"
            git push
          fi
